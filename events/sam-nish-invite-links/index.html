<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Invite link maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{--cream:#FBF3E4;--card:#fffaf0;--maroon:#5B0E17;--kumkum:#A3121F;--gold:#C8952E;--gold-d:#9C6F1B;--ink:#3a1a1a;--muted:#7a5a4a;--line:rgba(200,149,46,.45)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 60px}
h1{font-weight:600;font-size:32px;color:var(--maroon);margin:0 0 4px;text-align:center}
.sub{text-align:center;color:var(--muted);margin:0 0 22px}
label,.lab{display:block;font-family:Marcellus,serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-d);margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;cursor:pointer;margin:0;font-family:inherit;font-size:20px;letter-spacing:0;text-transform:none;color:var(--ink)}
.opt input{margin-top:6px;accent-color:var(--kumkum);width:18px;height:18px}
.opt small{display:block;color:var(--muted);font-size:16px}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;font:inherit;font-size:20px;color:var(--ink);resize:vertical}
textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
#names{min-height:130px}
#msg{min-height:110px;font-size:18px}
.hint{color:var(--muted);font-size:16px;margin:6px 2px 0}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.row b{display:block;font-weight:600;font-size:22px;color:var(--maroon);margin-bottom:2px;overflow-wrap:anywhere}
.row code{display:block;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere;margin-bottom:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button,a.b{font-family:Marcellus,serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;border-radius:10px;padding:11px 14px;cursor:pointer;text-decoration:none;border:1px solid var(--kumkum);background:#fff;color:var(--kumkum);min-height:44px;display:inline-flex;align-items:center}
button.p,a.p{background:var(--kumkum);color:#fff}
button.ok{background:#2e7d32;border-color:#2e7d32;color:#fff}
.empty{text-align:center;color:var(--muted);margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Invite link maker</h1>
  <p class="sub">Type names the normal way. Spaces and &amp; are fine here.</p>

  <span class="lab">Which invitation?</span>
  <div class="card">
    <label class="opt"><input type="radio" name="ver" value="https://savithruml.github.io/events/sam-nish-wedding/" checked><span>Both days<small>24 &amp; 25 December, all ceremonies</small></span></label>
    <label class="opt"><input type="radio" name="ver" value="https://savithruml.github.io/events/sam-nish/"><span>25 December only<small>Muhurtham and reception day</small></span></label>
  </div>

  <label for="names">Who are you inviting? One per line</label>
  <textarea id="names" rows="5" placeholder="Savi &amp; Suman&#10;Ramesh Uncle&#10;The Sharma Family" autocapitalize="words"></textarea>

  <label for="msg">Message</label>
  <textarea id="msg" rows="4"></textarea>
  <p class="hint">{name} and {link} are filled in for each person.</p>

  <span class="lab">Links</span>
  <div id="out"><p class="empty">Add a name above and its link appears here.</p></div>
</div>
<script>
var $=function(s){return document.querySelector(s)};
var DEF="Namaskara {name},\n\nWe joyfully invite you to the wedding of Samruddhi & Nishanth. Please open your invitation here:\n{link}";
$('#msg').value=DEF;
function slug(n){return encodeURIComponent(n.trim().replace(/\s*&\s*/g,' and ').replace(/\s+/g,'_'))}
function copy(t,btn){
  var done=function(){var o=btn.textContent;btn.textContent='Copied';btn.classList.add('ok');setTimeout(function(){btn.textContent=o;btn.classList.remove('ok')},1400)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fb)}else fb();
  function fb(){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity=0;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){}a.remove()}
}
function render(){
  var base=document.querySelector('input[name=ver]:checked').value,out=$('#out'),msg=$('#msg').value;
  var names=$('#names').value.split('\n').map(function(s){return s.trim()}).filter(Boolean);
  out.innerHTML='';
  if(!names.length){out.innerHTML='<p class="empty">Add a name above and its link appears here.</p>';return}
  names.forEach(function(n){
    var link=base+'?to='+slug(n),text=msg.replace(/\{name\}/g,n).replace(/\{link\}/g,link);
    var r=document.createElement('div');r.className='row';
    r.innerHTML='<b></b><code></code><div class="btns"><a class="b p" target="_blank" rel="noopener">WhatsApp</a><button data-k="m">Copy message</button><button data-k="l">Copy link</button></div>';
    r.querySelector('b').textContent=n;r.querySelector('code').textContent=link;
    r.querySelector('a').href='https://wa.me/?text='+encodeURIComponent(text);
    r.querySelector('[data-k=m]').onclick=function(){copy(text,this)};
    r.querySelector('[data-k=l]').onclick=function(){copy(link,this)};
    out.appendChild(r);
  });
}
['#names','#msg'].forEach(function(s){$(s).addEventListener('input',render)});
document.querySelectorAll('input[name=ver]').forEach(function(i){i.addEventListener('change',render)});
render();
</script>
</body>
</html>
