<!DOCTYPE html>
<html>

  {% include head.html %}

  <body class="theme-{% if site.resume_theme %}{{ site.resume_theme }}{% endif %}">

    <div class="wrapper">

      <header class="page-header">
        <h1 class="header-name"><a href="{{ '/' | relative_url }}" itemprop="name">{{ site.resume_name }}</a></h1>
        <div class="title-bar">
          <h2 class="header-title"><a href="{{ '/blog/' | relative_url }}">Blog</a></h2>
        </div>
      </header>

      <article class="post-content">
        <h1 class="post-title">{{ page.title }}</h1>
        <p class="post-meta">{{ page.date | date: "%B %d, %Y" }}</p>
        {{ content }}
      </article>

      <footer class="page-footer">
        <p class="footer-line"><a href="{{ '/blog/' | relative_url }}">← All posts</a> · <a href="{{ '/' | relative_url }}">Home</a></p>
      </footer>

    </div>

  </body>

</html>
