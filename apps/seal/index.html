<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seal</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="manifest" href="manifest.json"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/forge/1.3.1/forge.min.js"></script>
  <script>
  // Patch forge: tolerate EC / unknown key types without throwing
  if (window.forge && forge.pki) {
    const _origPK = forge.pki.publicKeyFromAsn1;
    forge.pki.publicKeyFromAsn1 = function(obj) {
      try { return _origPK.call(this, obj); }
      catch(e) { return { _unknownType: true, _err: e.message }; }
    };
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f0f0f;
      --surface: #1a1a1a;
      --border:  #2a2a2a;
      --text:    #ececec;
      --muted:   #888;
      --accent:  #a78bfa;
      --radius:  8px;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }

    html { height: 100%; }
    body { height: 100%; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: Helvetica, Arial, sans-serif; font-size: 14px; overflow: hidden; }

    /* ── Header ── */
    header {
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
      flex-shrink: 0;
    }
    .logo { flex-shrink: 0; width: 35px; height: 35px; }
    header h1 { font-size: 18px; font-weight: 400; letter-spacing: 0.01em; color: var(--text); }
    .status-dot {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .status-dot.ok::before    { background: #10b981; }
    .status-dot.warn::before  { background: #fbbf24; }
    .status-dot.error::before { background: #ef4444; }

    /* ── Workspace ── */
    .workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Footer ── */
    footer {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
    }

    /* ── Pane ── */
    .pane {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    #leftPane  { width: 300px; flex-shrink: 0; border-right: 1px solid var(--border); }
    #rightPane { flex: 1; }

    .pane-header {
      height: 40px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #aaa;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 8px;
    }
    .pane-header .hint {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
      color: #777;
      margin-left: auto;
    }
    .pane-header .canvas-tools { margin-left: auto; display: flex; gap: 4px; }

    /* ── Editor ── */
    #editor {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.65;
      padding: 14px;
      caret-color: var(--accent);
    }
    #editor::placeholder { color: #555; }

    /* ── Tool buttons ── */
    .pane-footer {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      gap: 8px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tool-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: #aaa;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 12px;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s;
    }
    .tool-btn:hover { color: var(--accent); border-color: var(--accent); }
    .tool-btn.icon-btn { padding: 6px 8px; }

    /* ── v-handle ── */
    .v-handle {
      width: 5px;
      cursor: col-resize;
      background: transparent;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
      transition: background 0.15s;
    }
    .v-handle:hover, .v-handle.dragging { background: var(--accent); opacity: 0.5; }

    /* ── Cert display ── */
    #certView {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow-y: auto;
    }

    .cert-wrap {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    #certView::-webkit-scrollbar { width: 6px; }
    #certView::-webkit-scrollbar-track { background: transparent; }
    #certView::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }

    .cert-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .cert-section-title {
      padding: 7px 14px;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-bottom: 1px solid var(--border);
      background: rgba(167, 139, 250, 0.04);
    }
    .cert-row {
      display: flex;
      align-items: flex-start;
      padding: 8px 14px;
      border-bottom: 1px solid #222;
      gap: 10px;
    }
    .cert-row:last-child { border-bottom: none; }
    .cert-key {
      font-size: 12px;
      color: #888;
      min-width: 140px;
      flex-shrink: 0;
      padding-top: 1px;
      font-family: var(--font-mono);
    }
    .cert-val {
      font-size: 13px;
      color: #ececec;
      font-family: var(--font-mono);
      word-break: break-all;
      flex: 1;
      line-height: 1.55;
    }
    .validity-badge {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      margin-left: 8px;
      vertical-align: middle;
    }
    .v-ok   { background: rgba(16,185,129,0.15); color: #10b981; }
    .v-warn { background: rgba(251,191,36,0.15);  color: #fbbf24; }
    .v-exp  { background: rgba(239,68,68,0.15);   color: #ef4444; }

    .san-list, .usage-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 14px;
    }
    .san-tag {
      background: rgba(167,139,250,0.08);
      border: 1px solid rgba(167,139,250,0.2);
      border-radius: 4px;
      padding: 3px 9px;
      font-size: 12px;
      color: #c4b5fd;
      font-family: var(--font-mono);
    }
    .usage-tag {
      background: #1c1c1c;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      padding: 3px 9px;
      font-size: 12px;
      color: #aaa;
    }
    .fp-val {
      font-size: 12px;
      line-height: 1.6;
    }

    /* ── Drag-over highlight ── */
    #leftPane.drag-over { outline: 2px dashed var(--accent); outline-offset: -4px; }
    #leftPane.drag-over textarea { opacity: 0.4; }

    /* ── Empty state ── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #333;
      gap: 10px;
      pointer-events: none;
      user-select: none;
    }
    .empty-state svg { opacity: 0.3; }
    .empty-state p { font-size: 13px; color: #666; }

    /* ── CA badge ── */
    .ca-badge {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      margin-left: 8px;
      vertical-align: middle;
      background: rgba(167,139,250,0.15);
      color: #a78bfa;
    }

    /* copy icon btn */
    .icon-btn svg { display: block; }
    .icon-btn.copied { color: #10b981; border-color: #10b981; }
  </style>
</head>
<body>

<header>
  <!-- Logo -->
  <svg class="logo" width="35" height="35" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="26" height="26" rx="6" fill="#1a0a2e"/>
    <!-- Shield outline -->

<div class="workspace">

          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

            <path d="M3 9H2.5C1.67 9 1 8.33 1 7.5V2.5C1 1.67 1.67 1 2.5 1H7.5C8.33 1 9 1.67 9 2.5V3" stroke="currentColor" stroke-width="1.2"/>
          </svg>

                fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M13.5 20 L17.5 24 L26.5 15"
                stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

<footer>© 2026 Savithru Lokanath</footer>

<script>
// ── v-handle drag ─────────────────────────────────────────────
const vHandle = document.getElementById('vHandle');
const leftPane = document.getElementById('leftPane');
let dragging = false, startX = 0, startW = 0;
vHandle.addEventListener('mousedown', e => {
  dragging = true; startX = e.clientX; startW = leftPane.offsetWidth;
  vHandle.classList.add('dragging'); e.preventDefault();
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const w = Math.min(Math.max(startW + e.clientX - startX, 180), window.innerWidth - 300);
  leftPane.style.width = w + 'px';
});
document.addEventListener('mouseup', () => { dragging = false; vHandle.classList.remove('dragging'); });

// No hardcoded sample — generate one via forge on demand

// ── Helpers ───────────────────────────────────────────────────
function getAttr(attrs, name) {
  const a = attrs.find(a => a.shortName === name || a.name === name);
  return a ? a.value : null;
}

function fmtDate(d) {
  if (!d) return '—';
  return d.toISOString().replace('T', ' ').replace(/\.\d+Z$/, ' UTC');
}

function daysUntil(d) {
  return Math.round((d - new Date()) / 86400000);
}

// Hash raw DER bytes directly — no need to re-serialize the cert
function hexFingerprint(rawPem, mdAlgo) {
  try {
    const b64 = rawPem.replace(/-----[^-]+-----/g, '').replace(/\s+/g, '');
    const der = forge.util.decode64(b64);
    const md = mdAlgo.create();
    md.update(der);
    return md.digest().toHex().toUpperCase().match(/../g).join(':');
  } catch(e) { return '—'; }
}

function fmtSerial(hex) {
  if (!hex) return '—';
  const upper = hex.toUpperCase();
  return upper.match(/../g)?.join(':') || upper;
}

function h(tag, cls, content) {
  return `<${tag}${cls ? ` class="${cls}"` : ''}>${content}</${tag}>`;
}

function row(key, val) {
  return `<div class="cert-row">${h('span','cert-key',key)}${h('span','cert-val',val)}</div>`;
}

function section(title, inner) {
  return `<div class="cert-section">${h('div','cert-section-title',title)}${inner}</div>`;
}

function subjRows(attrs) {
  const fields = [
    ['CN', 'Common Name'], ['O', 'Organization'], ['OU', 'Org Unit'],
    ['L', 'Locality'], ['ST', 'State'], ['C', 'Country']
  ];
  return fields
    .map(([sn, label]) => {
      const v = getAttr(attrs, sn);
      return v ? row(label, escHtml(v)) : '';
    }).join('');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Render cert ───────────────────────────────────────────────
function renderCert(pem) {
  // handle multiple certs — pick first
  const certs = pem.match(/-----BEGIN CERTIFICATE-----[\s\S]+?-----END CERTIFICATE-----/g);
  if (!certs) throw new Error('No valid PEM certificate block found');
  const count = certs.length;

  let cert;
  try {
    cert = forge.pki.certificateFromPem(certs[0]);
  } catch(e) {
    throw new Error('Failed to parse certificate: ' + e.message);
  }

  const html = [];

  // ── Subject
  const subjRows_ = subjRows(cert.subject.attributes);
  if (subjRows_) html.push(section('Subject', subjRows_));

  // ── Issuer
  const isSelf = cert.subject.hash === cert.issuer.hash;
  const issRowsHtml = subjRows(cert.issuer.attributes);
  if (issRowsHtml) {
    html.push(section('Issuer', issRowsHtml +
      (isSelf ? row('Self-signed', '<span class="ca-badge">yes</span>') : '')
    ));
  }

  // ── Validity
  const days = daysUntil(cert.validity.notAfter);
  const badge = days > 30
    ? `<span class="validity-badge v-ok">${days} days left</span>`
    : days >= 0
    ? `<span class="validity-badge v-warn">${days} days left</span>`
    : `<span class="validity-badge v-exp">expired ${-days} days ago</span>`;
  html.push(section('Validity',
    row('Not Before', escHtml(fmtDate(cert.validity.notBefore))) +
    row('Not After',  escHtml(fmtDate(cert.validity.notAfter)) + badge)
  ));

  // ── Serial number
  html.push(section('Serial Number',
    row('Hex', `<span class="fp-val">${escHtml(fmtSerial(cert.serialNumber))}</span>`)
  ));

  // ── Public key
  const pk = cert.publicKey;
  let pkType = 'Unknown', pkInfo = '';
  if (pk && pk._unknownType) {
    // EC or other unsupported key type — show what we know from siginfo
    pkType = 'EC / Other';
  } else if (pk && pk.n) {
    pkType = 'RSA';
    try { pkInfo = pk.n.bitLength() + ' bits'; } catch(e) {}
  } else if (pk && pk.curve) {
    pkType = 'EC (' + pk.curve + ')';
  }
  // Signature algorithm from siginfo OID or md
  let sigAlg = '—';
  try {
    const oid = cert.siginfo?.algorithmOid;
    if (oid) sigAlg = forge.pki.oids[oid] || oid;
    else if (cert.md?.algorithm) {
      sigAlg = cert.md.algorithm
        .replace('with','With').replace('sha','SHA')
        .replace('rsa','RSA').replace('ecdsa','ECDSA');
    }
  } catch(e) {}
  html.push(section('Public Key',
    row('Algorithm', escHtml(pkType)) +
    (pkInfo ? row('Key Size', escHtml(pkInfo)) : '') +
    row('Signature Alg', escHtml(sigAlg))
  ));

  // ── Fingerprints (hash raw DER — works for any key type)
  const fp256 = hexFingerprint(certs[0], forge.md.sha256);
  const fp1   = hexFingerprint(certs[0], forge.md.sha1);
  html.push(section('Fingerprints',
    row('SHA-256', `<span class="fp-val">${escHtml(fp256)}</span>`) +
    row('SHA-1',   `<span class="fp-val">${escHtml(fp1)}</span>`)
  ));

  // ── Extensions
  const extSAN = cert.extensions?.find(e => e.name === 'subjectAltName');
  const extKU  = cert.extensions?.find(e => e.name === 'keyUsage');
  const extEKU = cert.extensions?.find(e => e.name === 'extKeyUsage');
  const extBC  = cert.extensions?.find(e => e.name === 'basicConstraints');

  if (extSAN && extSAN.altNames && extSAN.altNames.length) {
    const tags = extSAN.altNames.map(n => {
      const val = n.value || n.ip || n.email || '';
      const prefix = n.type === 7 ? '🌐 ' : n.type === 1 ? '✉ ' : '';
      return `<span class="san-tag">${prefix}${escHtml(val)}</span>`;
    }).join('');
    html.push(section('Subject Alternative Names', `<div class="san-list">${tags}</div>`));
  }

  if (extKU) {
    const usages = [];
    const ku = extKU;
    if (ku.digitalSignature) usages.push('Digital Signature');
    if (ku.nonRepudiation)   usages.push('Non Repudiation');
    if (ku.keyEncipherment)  usages.push('Key Encipherment');
    if (ku.dataEncipherment) usages.push('Data Encipherment');
    if (ku.keyAgreement)     usages.push('Key Agreement');
    if (ku.keyCertSign)      usages.push('Cert Sign');
    if (ku.cRLSign)          usages.push('CRL Sign');
    if (usages.length) {
      const tags = usages.map(u => `<span class="usage-tag">${escHtml(u)}</span>`).join('');
      html.push(section('Key Usage', `<div class="usage-list">${tags}</div>`));
    }
  }

  if (extEKU) {
    const ekuNames = {
      serverAuth:      'TLS Server Auth',
      clientAuth:      'TLS Client Auth',
      codeSigning:     'Code Signing',
      emailProtection: 'Email Protection',
      timeStamping:    'Time Stamping',
      OCSPSigning:     'OCSP Signing',
    };
    const ekuTags = Object.entries(extEKU)
      .filter(([k,v]) => v === true && ekuNames[k])
      .map(([k]) => `<span class="usage-tag">${ekuNames[k]}</span>`)
      .join('');
    if (ekuTags) html.push(section('Extended Key Usage', `<div class="usage-list">${ekuTags}</div>`));
  }

  if (extBC) {
    html.push(section('Basic Constraints',
      row('CA', extBC.cA ? '<span class="ca-badge">true</span>' : 'false') +
      (extBC.pathLenConstraint !== undefined ? row('Path Length', String(extBC.pathLenConstraint)) : '')
    ));
  }

  if (count > 1) {
    html.push(`<div style="text-align:center;font-size:11px;color:#555;padding:8px 0;">${count - 1} additional cert${count > 2 ? 's' : ''} in chain (showing leaf)</div>`);
  }

  return { html: html.join(''), cert };
}

// ── Update UI ─────────────────────────────────────────────────
const editor    = document.getElementById('editor');
const certView  = document.getElementById('certView');
const statusDot = document.getElementById('statusDot');
const copyBtn   = document.getElementById('copyBtn');

let lastCert    = null;
let lastPem     = null;   // raw PEM string of the first block (for fingerprints + copy)
let copyTimeout = null;

const ICON_COPY  = `<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="4" y="4" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M3 9H2.5C1.67 9 1 8.33 1 7.5V2.5C1 1.67 1.67 1 2.5 1H7.5C8.33 1 9 1.67 9 2.5V3" stroke="currentColor" stroke-width="1.2"/></svg>`;
const ICON_CHECK = `<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2.5 6.5L5.5 9.5L10.5 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function setStatus(type, text) {
  statusDot.className = 'status-dot ' + (type || '');
  statusDot.textContent = text;
}

// ── PEM type detection ────────────────────────────────────────
function detectPemType(text) {
  const m = text.match(/-----BEGIN ([A-Z0-9 ]+)-----/);
  if (!m) return 'unknown';
  const t = m[1].trim();
  if (t.includes('CERTIFICATE REQUEST') || t.includes('NEW CERTIFICATE REQUEST')) return 'csr';
  if (t === 'CERTIFICATE') return 'cert';
  if (t.includes('PRIVATE KEY')) return 'key';
  if (t.includes('PUBLIC KEY')) return 'pubkey';
  return 'other';
}

// ── Render private key ────────────────────────────────────────
function renderKey(pem) {
  const m = pem.match(/-----BEGIN ([A-Z0-9 ]+)-----/);
  const header = m ? m[1].trim() : 'PRIVATE KEY';
  const html = [];

  let keyType = header.includes('RSA') ? 'RSA' : header.includes('EC') ? 'EC' : 'Unknown';
  let keySize = '—';

  if (window.forge) {
    try {
      if (header.includes('RSA') || header === 'PRIVATE KEY') {
        const key = forge.pki.privateKeyFromPem(pem);
        if (key && key.n) { keyType = 'RSA'; keySize = key.n.bitLength() + ' bits'; }
      }
    } catch(e) {}
  }

  html.push(section('Private Key',
    row('Type',      escHtml(keyType)) +
    (keySize !== '—' ? row('Size', escHtml(keySize)) : '') +
    row('PEM Header', escHtml(header)) +
    row('⚠ Warning', '<span style="color:#fbbf24">Key material detected — never share private keys</span>')
  ));

  return { html: html.join(''), summary: `${keyType} private key${keySize !== '—' ? ' · ' + keySize : ''}` };
}

// ── Render public key ─────────────────────────────────────────
function renderPubKey(pem) {
  const m = pem.match(/-----BEGIN ([A-Z0-9 ]+)-----/);
  const header = m ? m[1].trim() : 'PUBLIC KEY';
  const html = [];

  let keyType = '—', keySize = '—';
  if (window.forge) {
    try {
      const key = forge.pki.publicKeyFromPem(pem);
      if (key && key.n) { keyType = 'RSA'; keySize = key.n.bitLength() + ' bits'; }
      else if (key && key.curve) { keyType = 'EC'; keySize = key.curve; }
    } catch(e) {}
  }

  html.push(section('Public Key',
    row('Type',      escHtml(keyType)) +
    (keySize !== '—' ? row('Size / Curve', escHtml(keySize)) : '') +
    row('PEM Header', escHtml(header))
  ));

  return { html: html.join(''), summary: `${keyType} public key${keySize !== '—' ? ' · ' + keySize : ''}` };
}

// ── Render CSR ────────────────────────────────────────────────
function renderCSR(pem) {
  const html = [];

  if (!window.forge) throw new Error('forge library not available');

  let csr;
  try { csr = forge.pki.certificationRequestFromPem(pem); }
  catch(e) { throw new Error('Failed to parse CSR: ' + e.message); }

  const subjR = subjRows(csr.subject.attributes);
  if (subjR) html.push(section('Subject', subjR));

  // Public key
  const pk = csr.publicKey;
  let pkType = 'Unknown', pkSize = '';
  if (pk && pk._unknownType) { pkType = 'EC / Other'; }
  else if (pk && pk.n) { pkType = 'RSA'; try { pkSize = pk.n.bitLength() + ' bits'; } catch(e) {} }
  else if (pk && pk.curve) { pkType = 'EC (' + pk.curve + ')'; }
  html.push(section('Public Key',
    row('Algorithm', escHtml(pkType)) +
    (pkSize ? row('Key Size', escHtml(pkSize)) : '')
  ));

  // SANs from requested extensions
  const exts = csr.extensions || [];
  const extSAN = exts.find(e => e.name === 'subjectAltName');
  if (extSAN && extSAN.altNames && extSAN.altNames.length) {
    const tags = extSAN.altNames.map(n => {
      const val = n.value || n.ip || '';
      return `<span class="san-tag">${escHtml(val)}</span>`;
    }).join('');
    html.push(section('Requested SANs', `<div class="san-list">${tags}</div>`));
  }

  html.push(section('Type', row('Document', '<span class="ca-badge">Certificate Signing Request</span>')));

  const cn = getAttr(csr.subject.attributes, 'CN') || 'CSR';
  return { html: html.join(''), summary: cn + ' · CSR' };
}

// ── Master update ─────────────────────────────────────────────
function update() {
  const pem = editor.value.trim();
  if (!pem) {
    certView.innerHTML = `<div class="empty-state">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
        <path d="M20 3 L33 9.5 L33 20.5 C33 28 20 37 20 37 C20 37 7 28 7 20.5 L7 9.5 Z"
              fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M13.5 20 L17.5 24 L26.5 15"
              stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <p>Decoded fields will appear here</p>
    </div>`;
    setStatus('', 'paste or drop a PEM file');
    lastCert = null; lastPem = null;
    return;
  }

  const type = detectPemType(pem);

  try {
    if (type === 'cert') {
      const { html, cert } = renderCert(pem);
      certView.innerHTML = `<div class="cert-wrap">${html}</div>`;
      lastCert = cert;
      lastPem  = pem.match(/-----BEGIN CERTIFICATE-----[\s\S]+?-----END CERTIFICATE-----/)[0];
      const days = daysUntil(cert.validity.notAfter);
      const cn = getAttr(cert.subject.attributes, 'CN') || 'certificate';
      if (days > 30)       setStatus('ok',    `${escHtml(cn)} · ${days} days left`);
      else if (days >= 0)  setStatus('warn',  `${escHtml(cn)} · expiring soon`);
      else                 setStatus('error', `${escHtml(cn)} · expired`);

    } else if (type === 'key') {
      const { html, summary } = renderKey(pem);
      certView.innerHTML = `<div class="cert-wrap">${html}</div>`;
      lastCert = null; lastPem = null;
      setStatus('warn', summary);

    } else if (type === 'pubkey') {
      const { html, summary } = renderPubKey(pem);
      certView.innerHTML = `<div class="cert-wrap">${html}</div>`;
      lastCert = null; lastPem = null;
      setStatus('ok', summary);

    } else if (type === 'csr') {
      const { html, summary } = renderCSR(pem);
      certView.innerHTML = `<div class="cert-wrap">${html}</div>`;
      lastCert = null; lastPem = null;
      setStatus('ok', summary);

    } else {
      // Try as cert anyway
      try {
        const { html, cert } = renderCert(pem);
        certView.innerHTML = `<div class="cert-wrap">${html}</div>`;
        lastCert = cert;
        lastPem  = pem.match(/-----BEGIN [^-]+-----[\s\S]+?-----END [^-]+-----/)[0];
        setStatus('ok', 'certificate');
      } catch(e) {
        certView.innerHTML = `<div class="empty-state"><p style="color:#ef4444">${escHtml('Unknown PEM type: ' + (pem.match(/-----BEGIN ([^-]+)-----/)?.[1] || '?'))}</p></div>`;
        setStatus('error', 'unknown PEM type');
        lastCert = null; lastPem = null;
      }
    }
  } catch(e) {
    certView.innerHTML = `<div class="empty-state"><p style="color:#ef4444">${escHtml(e.message)}</p></div>`;
    setStatus('error', 'parse error');
    lastCert = null; lastPem = null;
  }
}

editor.addEventListener('input', update);

// ── File upload + drag-drop ───────────────────────────────────
const fileInput = document.getElementById('fileInput');

document.getElementById('uploadBtn').addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  loadFile(file);
  fileInput.value = '';
});

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    editor.value = e.target.result;
    update();
  };
  reader.readAsText(file);
}

leftPane.addEventListener('dragover', e => { e.preventDefault(); leftPane.classList.add('drag-over'); });
leftPane.addEventListener('dragleave', e => { if (!leftPane.contains(e.relatedTarget)) leftPane.classList.remove('drag-over'); });
leftPane.addEventListener('drop', e => {
  e.preventDefault();
  leftPane.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) loadFile(file);
});

// ── Buttons ───────────────────────────────────────────────────
document.getElementById('sampleBtn').addEventListener('click', () => {
  if (!window.forge) { setStatus('error', 'forge library not loaded'); return; }
  setStatus('', 'generating…');
  // Use setTimeout so the status text renders before blocking RSA gen
  setTimeout(() => {
    try {
      const kp   = forge.pki.rsa.generateKeyPair(512); // small key — demo only
      const cert = forge.pki.createCertificate();
      cert.publicKey   = kp.publicKey;
      cert.serialNumber = '01A2B3C4';
      cert.validity.notBefore = new Date('2024-01-15T00:00:00Z');
      cert.validity.notAfter  = new Date('2025-12-31T23:59:59Z');
      const subj = [
        {name:'commonName',       value:'demo.example.com'},
        {name:'organizationName', value:'Example Corp'},
        {shortName:'OU',          value:'Engineering'},
        {shortName:'L',           value:'San Francisco'},
        {shortName:'ST',          value:'California'},
        {shortName:'C',           value:'US'},
      ];
      cert.setSubject(subj);
      cert.setIssuer([
        {name:'commonName',       value:'Example Root CA'},
        {name:'organizationName', value:'Example Corp'},
        {shortName:'C',           value:'US'},
      ]);
      cert.setExtensions([
        {name:'basicConstraints', cA:false},
        {name:'keyUsage', digitalSignature:true, keyEncipherment:true},
        {name:'extKeyUsage', serverAuth:true, clientAuth:false},
        {name:'subjectAltName', altNames:[
          {type:2, value:'demo.example.com'},
          {type:2, value:'www.demo.example.com'},
          {type:2, value:'*.demo.example.com'},
        ]},
      ]);
      cert.sign(kp.privateKey, forge.md.sha256.create());
      editor.value = forge.pki.certificateToPem(cert);
      update();
    } catch(e) {
      setStatus('error', 'generation failed: ' + e.message);
    }
  }, 16);
});

document.getElementById('clearBtn').addEventListener('click', () => {
  editor.value = '';
  update();
});

copyBtn.addEventListener('click', () => {
  if (!lastCert || !lastPem) return;
  const text = [
    '=== Subject ===',
    ...lastCert.subject.attributes.map(a => `${a.shortName || a.name}: ${a.value}`),
    '',
    '=== Issuer ===',
    ...lastCert.issuer.attributes.map(a => `${a.shortName || a.name}: ${a.value}`),
    '',
    '=== Validity ===',
    'Not Before: ' + fmtDate(lastCert.validity.notBefore),
    'Not After:  ' + fmtDate(lastCert.validity.notAfter),
    '',
    '=== Serial ===',
    fmtSerial(lastCert.serialNumber),
    '',
    '=== SHA-256 Fingerprint ===',
    hexFingerprint(lastPem, forge.md.sha256),
  ].join('\n');
  navigator.clipboard.writeText(text).then(() => {
    copyBtn.innerHTML = ICON_CHECK;
    copyBtn.classList.add('copied');
    clearTimeout(copyTimeout);
    copyTimeout = setTimeout(() => {
      copyBtn.innerHTML = ICON_COPY;
      copyBtn.classList.remove('copied');
    }, 1600);
  });
});

// init
update();
</script>
</body>
</html>
