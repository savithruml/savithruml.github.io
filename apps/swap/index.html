<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Swap</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="manifest" href="manifest.json"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script>if (!window.jsyaml) document.write('<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"><\/script>');</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f0f0f;
      --surface: #161616;
      --border:  #222;
      --text:    #d4d4d4;
      --muted:   #666;
      --accent:  #f97316;
      --radius:  8px;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: Helvetica, Arial, sans-serif; font-size: 13px; overflow: hidden; }

    /* ── Header ── */
    header {
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
      flex-shrink: 0;
    }
    .logo { flex-shrink: 0; }
    header h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; color: #e8e8e8; }
    .status-dot {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .status-dot.ok::before    { background: #10b981; }
    .status-dot.error::before { background: #ef4444; }

    /* ── Workspace ── */
    .workspace {
      display: flex;
      height: calc(100vh - 48px);
      overflow: hidden;
    }

    /* ── Pane ── */
    .pane {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
      min-width: 0;
    }

    .pane-header {
      height: 34px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #888;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 8px;
    }
    .pane-header .canvas-tools { margin-left: auto; display: flex; gap: 4px; }
    .pane-header .format-badge {
      margin-left: 6px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 1px 7px;
      border-radius: 10px;
      background: rgba(249,115,22,0.12);
      color: var(--accent);
      border: 1px solid rgba(249,115,22,0.25);
    }

    /* ── Editor ── */
    .pane-editor {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 11.5px;
      line-height: 1.65;
      padding: 14px;
      caret-color: var(--accent);
    }
    .pane-editor::placeholder { color: #3a3a3a; }
    #yamlEl { border-left: 1px solid var(--border); }
    #yamlEl:focus { background: #0c0c0c; }
    #jsonEl:focus { background: #0c0c0c; }

    /* ── v-handle ── */
    .v-handle {
      width: 5px;
      cursor: col-resize;
      background: transparent;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
      transition: background 0.15s;
    }
    .v-handle:hover, .v-handle.dragging { background: var(--accent); opacity: 0.5; }

    /* ── Tool buttons ── */
    .tool-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: #888;
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s;
    }
    .tool-btn:hover { color: var(--accent); border-color: var(--accent); }
    .tool-btn.icon-btn { padding: 4px 6px; }
    .tool-btn.icon-btn.copied { color: #10b981; border-color: #10b981; }

    /* ── Error overlay ── */
    .err-strip {
      font-size: 11px;
      color: #ef4444;
      background: rgba(239,68,68,0.06);
      border-top: 1px solid rgba(239,68,68,0.2);
      padding: 6px 14px;
      min-height: 28px;
      display: none;
      flex-shrink: 0;
      font-family: var(--font-mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .err-strip.visible { display: block; }

    /* ── Swap bar ── */
    .swap-bar {
      position: absolute;
      left: 50%;
      top: calc(48px + 17px);
      transform: translateX(-50%);
      z-index: 20;
    }
    .swap-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: #888;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s, transform 0.2s;
    }
    .swap-btn:hover { color: var(--accent); border-color: var(--accent); }
    .swap-btn.spin { transform: rotate(180deg); }
  </style>
</head>
<body>

<header>
  <svg class="logo" width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="26" height="26" rx="6" fill="#1e0f00"/>
    <!-- Right arrow (top) -->
    <path d="M5 9 L16 9 M13 6 L16 9 L13 12" stroke="#fb923c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Left arrow (bottom) -->
    <path d="M21 17 L10 17 M13 14 L10 17 L13 20" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>Swap</h1>
  <span class="status-dot" id="statusDot">ready</span>
</header>

<!-- Floating swap button -->
<div class="swap-bar">
  <button class="swap-btn" id="swapBtn" title="Swap JSON ↔ YAML">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M2 4.5 L10 4.5 M8 2 L10 4.5 L8 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 9.5 L4 9.5 M6 7 L4 9.5 L6 12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<div class="workspace">

  <!-- JSON pane -->
  <div class="pane" id="jsonPane">
    <div class="pane-header">
      JSON
      <span class="format-badge" id="jsonBadge">auto</span>
      <div class="canvas-tools">
        <button class="tool-btn icon-btn" id="copyJsonBtn" title="Copy JSON">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <rect x="4" y="4" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
            <path d="M3 9H2.5C1.67 9 1 8.33 1 7.5V2.5C1 1.67 1.67 1 2.5 1H7.5C8.33 1 9 1.67 9 2.5V3" stroke="currentColor" stroke-width="1.2"/>
          </svg>
        </button>
      </div>
    </div>
    <textarea class="pane-editor" id="jsonEl" spellcheck="false" placeholder='{
  "name": "Swap",
  "version": "1.0",
  "features": ["convert", "sync"],
  "config": {
    "indent": 2,
    "live": true
  }
}'></textarea>
    <div class="err-strip" id="jsonErr"></div>
  </div>

  <!-- v-handle -->
  <div class="v-handle" id="vHandle"></div>

  <!-- YAML pane -->
  <div class="pane" id="yamlPane">
    <div class="pane-header">
      YAML
      <span class="format-badge" id="yamlBadge">auto</span>
      <div class="canvas-tools">
        <button class="tool-btn icon-btn" id="copyYamlBtn" title="Copy YAML">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <rect x="4" y="4" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
            <path d="M3 9H2.5C1.67 9 1 8.33 1 7.5V2.5C1 1.67 1.67 1 2.5 1H7.5C8.33 1 9 1.67 9 2.5V3" stroke="currentColor" stroke-width="1.2"/>
          </svg>
        </button>
      </div>
    </div>
    <textarea class="pane-editor" id="yamlEl" spellcheck="false" placeholder="name: Swap
version: '1.0'
features:
  - convert
  - sync
config:
  indent: 2
  live: true"></textarea>
    <div class="err-strip" id="yamlErr"></div>
  </div>

</div>

<script>
// ── v-handle drag ─────────────────────────────────────────────
const vHandle  = document.getElementById('vHandle');
const jsonPane = document.getElementById('jsonPane');
const yamlPane = document.getElementById('yamlPane');
let dragging = false, startX = 0, startRatio = 0.5;

vHandle.addEventListener('mousedown', e => {
  dragging = true;
  startX = e.clientX;
  const total = jsonPane.offsetWidth + yamlPane.offsetWidth;
  startRatio = jsonPane.offsetWidth / total;
  vHandle.classList.add('dragging');
  e.preventDefault();
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const total = jsonPane.offsetWidth + vHandle.offsetWidth + yamlPane.offsetWidth;
  const newW = Math.min(Math.max(startRatio * total + (e.clientX - startX), 180), total - 180);
  jsonPane.style.flex = 'none';
  jsonPane.style.width = newW + 'px';
  yamlPane.style.flex = '1';
});
document.addEventListener('mouseup', () => { dragging = false; vHandle.classList.remove('dragging'); });

// ── Conversion ────────────────────────────────────────────────
const jsonEl   = document.getElementById('jsonEl');
const yamlEl   = document.getElementById('yamlEl');
const jsonErr  = document.getElementById('jsonErr');
const yamlErr  = document.getElementById('yamlErr');
const statusDot = document.getElementById('statusDot');
const jsonBadge = document.getElementById('jsonBadge');
const yamlBadge = document.getElementById('yamlBadge');

function setStatus(type, text) {
  statusDot.className = 'status-dot ' + (type || '');
  statusDot.textContent = text;
}

function showErr(el, msg) { el.textContent = msg; el.classList.add('visible'); }
function hideErr(el)       { el.textContent = ''; el.classList.remove('visible'); }

function jsonToYaml() {
  const txt = jsonEl.value;
  if (!txt.trim()) { yamlEl.value = ''; hideErr(jsonErr); hideErr(yamlErr); setStatus('', 'ready'); return; }
  if (!window.jsyaml) { showErr(jsonErr, 'js-yaml library failed to load — check network'); return; }
  try {
    const obj = JSON.parse(txt);
    yamlEl.value = jsyaml.dump(obj, { indent: 2, lineWidth: -1, noCompatMode: true });
    hideErr(jsonErr);
    hideErr(yamlErr);
    setStatus('ok', 'valid JSON');
    jsonBadge.textContent = 'JSON';
    yamlBadge.textContent = 'YAML';
  } catch(e) {
    showErr(jsonErr, 'JSON: ' + e.message.split('\n')[0]);
    setStatus('error', 'invalid JSON');
  }
}

function yamlToJson() {
  const txt = yamlEl.value;
  if (!txt.trim()) { jsonEl.value = ''; hideErr(jsonErr); hideErr(yamlErr); setStatus('', 'ready'); return; }
  if (!window.jsyaml) { showErr(yamlErr, 'js-yaml library failed to load — check network'); return; }
  try {
    const obj = jsyaml.load(txt);
    if (obj === undefined) { hideErr(yamlErr); return; }
    jsonEl.value = JSON.stringify(obj, null, 2);
    hideErr(yamlErr);
    hideErr(jsonErr);
    setStatus('ok', 'valid YAML');
    jsonBadge.textContent = 'JSON';
    yamlBadge.textContent = 'YAML';
  } catch(e) {
    showErr(yamlErr, 'YAML: ' + e.message.split('\n')[0]);
    setStatus('error', 'invalid YAML');
  }
}

jsonEl.addEventListener('input', jsonToYaml);
yamlEl.addEventListener('input', yamlToJson);

// ── Swap button ───────────────────────────────────────────────
const swapBtn = document.getElementById('swapBtn');
swapBtn.addEventListener('click', () => {
  const jTxt = jsonEl.value;
  const yTxt = yamlEl.value;
  jsonEl.value = '';
  yamlEl.value = '';
  hideErr(jsonErr);
  hideErr(yamlErr);

  // Try to convert YAML→JSON (put yaml content into json side, re-render)
  if (yTxt.trim()) {
    try {
      const obj = jsyaml.load(yTxt);
      jsonEl.value = JSON.stringify(obj, null, 2);
      yamlEl.value = jsyaml.dump(obj, { indent: 2, lineWidth: -1, noCompatMode: true });
      setStatus('ok', 'swapped');
    } catch(e) {
      jsonEl.value = yTxt;
      yamlEl.value = jTxt;
    }
  } else if (jTxt.trim()) {
    try {
      const obj = JSON.parse(jTxt);
      yamlEl.value = jsyaml.dump(obj, { indent: 2, lineWidth: -1, noCompatMode: true });
      jsonEl.value = JSON.stringify(obj, null, 2);
      setStatus('ok', 'swapped');
    } catch(e) {
      jsonEl.value = jTxt;
      yamlEl.value = yTxt;
    }
  }

  swapBtn.classList.add('spin');
  setTimeout(() => swapBtn.classList.remove('spin'), 300);
});

// ── Copy buttons ──────────────────────────────────────────────
const ICON_COPY  = `<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="4" y="4" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M3 9H2.5C1.67 9 1 8.33 1 7.5V2.5C1 1.67 1.67 1 2.5 1H7.5C8.33 1 9 1.67 9 2.5V3" stroke="currentColor" stroke-width="1.2"/></svg>`;
const ICON_CHECK = `<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2.5 6.5L5.5 9.5L10.5 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function copyBtn(srcEl, btn) {
  const txt = srcEl.value.trim();
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => {
    btn.innerHTML = ICON_CHECK;
    btn.classList.add('copied');
    setTimeout(() => { btn.innerHTML = ICON_COPY; btn.classList.remove('copied'); }, 1600);
  });
}

document.getElementById('copyJsonBtn').addEventListener('click', function() {
  copyBtn(jsonEl, this);
});
document.getElementById('copyYamlBtn').addEventListener('click', function() {
  copyBtn(yamlEl, this);
});

// ── Format badges on focus ────────────────────────────────────
jsonEl.addEventListener('focus', () => { jsonBadge.textContent = 'editing'; });
jsonEl.addEventListener('blur',  () => { jsonBadge.textContent = jsonEl.value.trim() ? 'JSON' : 'auto'; });
yamlEl.addEventListener('focus', () => { yamlBadge.textContent = 'editing'; });
yamlEl.addEventListener('blur',  () => { yamlBadge.textContent = yamlEl.value.trim() ? 'YAML' : 'auto'; });
</script>
</body>
</html>
