<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Swap</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="manifest" href="manifest.json"/>
  <script>
/* ── Inline YAML (no CDN dependency) ─────────────────────── */
window.jsyaml = (function(){
  'use strict';

  /* ── DUMP: JS → YAML ──────────────────────────────────── */
  var NEEDS_QUOTE = /[:{}\[\]|>&*!,%@`'"\\#\n\r\t]|^[\s\-?]|\s$/;
  var IS_SPECIAL  = /^(true|false|null|~|yes|no|on|off)$/i;
  var IS_NUM      = /^[-+]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$|^0x[0-9a-fA-F]+$/;

  function qStr(s){
    if(s==='') return "''";
    if(/[\n\r\t]/.test(s))
      return '"'+s.replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\n/g,'\\n').replace(/\r/g,'\\r').replace(/\t/g,'\\t')+'"';
    var t=s.trim();
    if(IS_SPECIAL.test(t)||IS_NUM.test(t)||NEEDS_QUOTE.test(s))
      return s.indexOf("'")<0 ? "'"+s+"'" : '"'+s.replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"';
    return s;
  }
  function qKey(k){
    k=String(k);
    if(!k) return "''";
    if(/[:{}\[\],&*#?|<>=!%@`'"\/]/.test(k)||/^\s|\s$/.test(k)||IS_SPECIAL.test(k.trim())||IS_NUM.test(k.trim()))
      return k.indexOf("'")<0 ? "'"+k+"'" : '"'+k.replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"';
    return k;
  }
  function _dv(v,lvl,ind){
    var pad=Array(lvl*ind+1).join(' ');
    if(v===null||v===undefined) return 'null';
    if(v===true)  return 'true';
    if(v===false) return 'false';
    if(typeof v==='number') return isFinite(v)?String(v):'null';
    if(typeof v==='string') return qStr(v);
    if(Array.isArray(v)){
      if(!v.length) return '[]';
      var rows=v.map(function(item){
        var r=_dv(item,lvl+1,ind);
        return r.charAt(0)==='\n' ? pad+'-'+r : pad+'- '+r;
      });
      return '\n'+rows.join('\n');
    }
    if(typeof v==='object'){
      var ks=Object.keys(v);
      if(!ks.length) return '{}';
      var ls=ks.map(function(k){
        var r=_dv(v[k],lvl+1,ind);
        return r.charAt(0)==='\n' ? pad+qKey(k)+':'+r : pad+qKey(k)+': '+r;
      });
      return '\n'+ls.join('\n');
    }
    return qStr(String(v));
  }
  function dump(obj,opts){
    var ind=(opts&&opts.indent)||2;
    var s=_dv(obj,0,ind);
    return (s.charAt(0)==='\n'?s.slice(1):s)+'\n';
  }

  /* ── LOAD: YAML → JS ──────────────────────────────────── */
  function load(text){
    if(!text||!text.trim()) return null;
    text=text.replace(/^﻿/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    var rawLines=text.split('\n'), lines=[];
    for(var i=0;i<rawLines.length;i++){
      var raw=rawLines[i].replace(/\s+$/,'');
      var tr=raw.replace(/^\s+/,'');
      if(tr.charAt(0)==='#'){ lines.push({blank:true,full:''}); continue; }
      if(!tr){ lines.push({blank:true,full:raw}); continue; }
      var content=stripCmt(tr);
      lines.push({indent:raw.length-tr.length, content:content, full:raw, blank:false});
    }
    var pos=0;
    function skipB(){ while(pos<lines.length&&lines[pos].blank) pos++; }
    function pk(){ var p=pos; while(p<lines.length&&lines[p].blank) p++; return p<lines.length?lines[p]:null; }
    function cs(){ while(pos<lines.length&&lines[pos].blank) pos++; return pos<lines.length?lines[pos++]:null; }
    function parseVal(minI){
      var cur=pk();
      if(!cur||cur.indent<minI) return undefined;
      var c=cur.content;
      return (c==='-'||(c.charAt(0)==='-'&&c.charAt(1)===' ')) ? parseSeq(cur.indent) : parseMap(cur.indent);
    }
    function resolveV(after,pInd){
      after=(after||'').trim();
      if(after===''||after==='~'){ var nx=pk(); return (nx&&nx.indent>pInd)?parseVal(pInd+1):null; }
      if(after==='|'||after==='|-'||after==='|+') return parseBlockLit(pInd+1,after);
      if(after==='>'||after==='>-'||after==='>+') return parseBlockFold(pInd+1,after);
      if(after.charAt(0)==='['||after.charAt(0)==='{'){try{return JSON.parse(after);}catch(e){}}
      return parseScalar(after);
    }
    function parseMap(iLvl){
      var obj={};
      for(;;){
        var ln=pk();
        if(!ln||ln.indent<iLvl) break;
        if(ln.indent>iLvl){cs();continue;}
        var c=ln.content;
        if(c==='-'||(c.charAt(0)==='-'&&c.charAt(1)===' ')) break;
        var ci=findColon(c);
        if(ci<0) break;
        cs();
        var key=parseScalar(c.slice(0,ci).trim());
        var after=c.slice(ci+1).replace(/^\s/,'');
        obj[key]=resolveV(after,iLvl);
      }
      return obj;
    }
    function parseSeq(iLvl){
      var arr=[];
      for(;;){
        var ln=pk();
        if(!ln||ln.indent<iLvl) break;
        if(ln.indent>iLvl){cs();continue;}
        var c=ln.content;
        if(c!=='-'&&!(c.charAt(0)==='-'&&c.charAt(1)===' ')) break;
        cs();
        var ad=(c==='-')?'':c.slice(2).trim();
        if(!ad){
          var nx=pk();
          arr.push((nx&&nx.indent>iLvl)?parseVal(iLvl+1):null);
        } else {
          var ci=findColon(ad);
          if(ci>=0){
            var iI=ln.indent+2, item={};
            var fk=parseScalar(ad.slice(0,ci).trim());
            var fv=ad.slice(ci+1).replace(/^\s/,'').trim();
            item[fk]=resolveV(fv,iI-1);
            for(;;){
              var n2=pk();
              if(!n2||n2.indent<iI) break;
              if(n2.indent>iI){cs();continue;}
              var ci2=findColon(n2.content);
              if(ci2<0) break;
              cs();
              var nk=parseScalar(n2.content.slice(0,ci2).trim());
              var nv=n2.content.slice(ci2+1).replace(/^\s/,'').trim();
              item[nk]=resolveV(nv,iI);
            }
            arr.push(item);
          } else {
            arr.push(parseScalar(ad));
          }
        }
      }
      return arr;
    }
    function parseBlockLit(minI,style){
      var strs=[],bI=null;
      while(pos<lines.length){
        var ln=lines[pos];
        if(ln.blank){strs.push('');pos++;continue;}
        if(bI===null){if(ln.indent<minI) break; bI=ln.indent;}
        if(ln.indent<bI) break;
        strs.push(ln.full.slice(bI));
        pos++;
      }
      while(strs.length&&strs[strs.length-1]==='') strs.pop();
      return (style==='|'||style==='|+')?strs.join('\n')+'\n':strs.join('\n');
    }
    function parseBlockFold(minI,style){
      var strs=[],bI=null;
      while(pos<lines.length){
        var ln=lines[pos];
        if(ln.blank){strs.push('');pos++;continue;}
        if(bI===null){if(ln.indent<minI) break; bI=ln.indent;}
        if(ln.indent<bI) break;
        strs.push(ln.full.slice(bI));
        pos++;
      }
      while(strs.length&&strs[strs.length-1]==='') strs.pop();
      var r=strs.join('\n').replace(/([^\n])\n([^\n])/g,'$1 $2');
      return (style==='>'||style==='>+')?r+'\n':r;
    }
    function findColon(s){
      var inS=false,inD=false;
      for(var i=0;i<s.length;i++){
        var c=s[i];
        if(c==="'"&&!inD){inS=!inS;continue;}
        if(c==='"'&&!inS){inD=!inD;continue;}
        if(!inS&&!inD&&c===':'&&(i+1>=s.length||s[i+1]===' '||s[i+1]==='\t')) return i;
      }
      return -1;
    }
    function stripCmt(s){
      var inS=false,inD=false;
      for(var i=0;i<s.length;i++){
        var c=s[i];
        if(c==="'"&&!inD){inS=!inS;continue;}
        if(c==='"'&&!inS){inD=!inD;continue;}
        if(!inS&&!inD&&c==='#'&&(i===0||s[i-1]===' ')) return s.slice(0,i).replace(/\s+$/,'');
      }
      return s;
    }
    function parseScalar(s){
      s=(s||'').trim();
      if(!s||s==='~'||s==='null') return null;
      if(s==='true'||s==='yes'||s==='on')  return true;
      if(s==='false'||s==='no'||s==='off') return false;
      if(s.length>=2){
        if(s.charAt(0)==="'"&&s.charAt(s.length-1)==="'") return s.slice(1,-1).replace(/''/g,"'");
        if(s.charAt(0)==='"'&&s.charAt(s.length-1)==='"')
          return s.slice(1,-1).replace(/\\n/g,'\n').replace(/\\t/g,'\t').replace(/\\r/g,'\r').replace(/\\"/g,'"').replace(/\\\\/g,'\\');
      }
      if(/^0x[0-9a-fA-F]+$/.test(s)) return parseInt(s,16);
      if(/^-?\d+$/.test(s)) return parseInt(s,10);
      if(/^-?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(s)) return parseFloat(s);
      return s;
    }
    return parseVal(0);
  }

  return {load:load, dump:dump};
}());
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f0f0f;
      --surface: #161616;
      --border:  #222;
      --text:    #ececec;
      --muted:   #666;
      --accent:  #f97316;
      --radius:  8px;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }

    html { height: 100%; }
    body { height: 100%; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: Helvetica, Arial, sans-serif; font-size: 13px; overflow: hidden; }

    /* ── Header ── */
    header {
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
      flex-shrink: 0;
    }
    .logo { flex-shrink: 0; width: 35px; height: 35px; }
    header h1 { font-size: 18px; font-weight: 400; letter-spacing: 0.01em; color: var(--text); }
    .status-dot {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .status-dot.ok::before    { background: #10b981; }
    .status-dot.error::before { background: #ef4444; }

    /* ── Workspace ── */
    .workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Footer ── */
    footer {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: #888;
      flex-shrink: 0;
    }

    /* ── Pane ── */
    .pane {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
      min-width: 0;
    }

    .pane-header {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #aaa;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 8px;
    }
    .pane-header { position: relative; }
    .pane-header .canvas-tools { position: absolute; right: 14px; display: flex; gap: 4px; }
    .pane-header .format-badge {
      margin-left: 6px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 1px 7px;
      border-radius: 10px;
      background: rgba(249,115,22,0.12);
      color: var(--accent);
      border: 1px solid rgba(249,115,22,0.25);
    }

    /* ── Editor ── */
    .pane-editor {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.65;
      padding: 14px;
      caret-color: var(--accent);
    }
    .pane-editor::placeholder { color: #777; }
    #yamlEl { border-left: 1px solid var(--border); }
    #yamlEl:focus { background: #0c0c0c; }
    #jsonEl:focus { background: #0c0c0c; }

    /* ── v-handle ── */
    .v-handle {
      width: 5px;
      cursor: col-resize;
      background: transparent;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
      transition: background 0.15s;
    }
    .v-handle:hover, .v-handle.dragging { background: var(--accent); opacity: 0.5; }

    /* ── Swap bar ── */
    /* ── Tool buttons ── */
    .tool-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: #888;
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s;
    }
    .tool-btn:hover { color: var(--accent); border-color: var(--accent); }
    .tool-btn.icon-btn { padding: 4px 6px; }
    .tool-btn.icon-btn.copied { color: #10b981; border-color: #10b981; }

    /* ── Error overlay ── */
    .err-strip {
      font-size: 11px;
      color: #ef4444;
      background: rgba(239,68,68,0.06);
      border-top: 1px solid rgba(239,68,68,0.2);
      padding: 6px 14px;
      min-height: 28px;
      display: none;
      flex-shrink: 0;
      font-family: var(--font-mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .err-strip.visible { display: block; }

  
    /* ── Share button ── */
    .share-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: #888;
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
      font-family: inherit;
    }
    .share-btn:hover { color: var(--accent); border-color: var(--accent); }
    .share-btn.copied { color: #10b981; border-color: #10b981; }
</style>
</head>
<body>

<header>
  <svg class="logo" width="35" height="35" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="26" height="26" rx="6" fill="#1e0f00"/>
    <!-- Right arrow (top) -->
    <path d="M5 9 L16 9 M13 6 L16 9 L13 12" stroke="#fb923c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Left arrow (bottom) -->
    <path d="M21 17 L10 17 M13 14 L10 17 L13 20" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>Swap</h1>
  <span class="status-dot" id="statusDot">ready</span>
  <button class="share-btn" id="shareBtn" title="Copy shareable link">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Share
  </button>
</header>


<div class="workspace">

  <!-- JSON pane -->
  <div class="pane" id="jsonPane">
    <div class="pane-header">
      JSON
      <span class="format-badge" id="jsonBadge">auto</span>
      <div class="canvas-tools">
        <button class="tool-btn icon-btn" id="copyJsonBtn" title="Copy JSON">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <rect x="4" y="4" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
            <path d="M3 9H2.5C1.67 9 1 8.33 1 7.5V2.5C1 1.67 1.67 1 2.5 1H7.5C8.33 1 9 1.67 9 2.5V3" stroke="currentColor" stroke-width="1.2"/>
          </svg>
        </button>
      </div>
    </div>
    <textarea class="pane-editor" id="jsonEl" spellcheck="false" placeholder='{
  "name": "Swap",
  "version": "1.0",
  "features": ["convert", "sync"],
  "config": {
    "indent": 2,
    "live": true
  }
}'></textarea>
    <div class="err-strip" id="jsonErr"></div>
  </div>

  <!-- v-handle -->
  <div class="v-handle" id="vHandle"></div>

  <!-- YAML pane -->
  <div class="pane" id="yamlPane">
    <div class="pane-header">
      YAML
      <span class="format-badge" id="yamlBadge">auto</span>
      <div class="canvas-tools">
        <button class="tool-btn icon-btn" id="copyYamlBtn" title="Copy YAML">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <rect x="4" y="4" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
            <path d="M3 9H2.5C1.67 9 1 8.33 1 7.5V2.5C1 1.67 1.67 1 2.5 1H7.5C8.33 1 9 1.67 9 2.5V3" stroke="currentColor" stroke-width="1.2"/>
          </svg>
        </button>
      </div>
    </div>
    <textarea class="pane-editor" id="yamlEl" spellcheck="false" placeholder="name: Swap
version: '1.0'
features:
  - convert
  - sync
config:
  indent: 2
  live: true"></textarea>
    <div class="err-strip" id="yamlErr"></div>
  </div>

</div>

<footer>© 2026 Savithru Lokanath</footer>

<script>
// ── v-handle drag ─────────────────────────────────────────────
const vHandle  = document.getElementById('vHandle');
const jsonPane = document.getElementById('jsonPane');
const yamlPane = document.getElementById('yamlPane');
let dragging = false, startX = 0, startRatio = 0.5;

vHandle.addEventListener('mousedown', e => {
  dragging = true;
  startX = e.clientX;
  const total = jsonPane.offsetWidth + yamlPane.offsetWidth;
  startRatio = jsonPane.offsetWidth / total;
  vHandle.classList.add('dragging');
  e.preventDefault();
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const total = jsonPane.offsetWidth + vHandle.offsetWidth + yamlPane.offsetWidth;
  const newW = Math.min(Math.max(startRatio * total + (e.clientX - startX), 180), total - 180);
  jsonPane.style.flex = 'none';
  jsonPane.style.width = newW + 'px';
  yamlPane.style.flex = '1';
});
document.addEventListener('mouseup', () => { dragging = false; vHandle.classList.remove('dragging'); });

// ── Conversion ────────────────────────────────────────────────
const jsonEl   = document.getElementById('jsonEl');
const yamlEl   = document.getElementById('yamlEl');
const jsonErr  = document.getElementById('jsonErr');
const yamlErr  = document.getElementById('yamlErr');
const statusDot = document.getElementById('statusDot');
const jsonBadge = document.getElementById('jsonBadge');
const yamlBadge = document.getElementById('yamlBadge');

function setStatus(type, text) {
  statusDot.className = 'status-dot ' + (type || '');
  statusDot.textContent = text;
}

function showErr(el, msg) { el.textContent = msg; el.classList.add('visible'); }
function hideErr(el)       { el.textContent = ''; el.classList.remove('visible'); }

function jsonToYaml() {
  const txt = jsonEl.value;
  if (!txt.trim()) { yamlEl.value = ''; hideErr(jsonErr); hideErr(yamlErr); setStatus('', 'ready'); return; }
  try {
    const obj = JSON.parse(txt);
    yamlEl.value = jsyaml.dump(obj, { indent: 2, lineWidth: -1, noCompatMode: true });
    hideErr(jsonErr);
    hideErr(yamlErr);
    setStatus('ok', 'valid JSON');
    jsonBadge.textContent = 'JSON';
    yamlBadge.textContent = 'YAML';
  } catch(e) {
    showErr(jsonErr, 'JSON: ' + e.message.split('\n')[0]);
    setStatus('error', 'invalid JSON');
  }
}

function yamlToJson() {
  const txt = yamlEl.value;
  if (!txt.trim()) { jsonEl.value = ''; hideErr(jsonErr); hideErr(yamlErr); setStatus('', 'ready'); return; }
  try {
    const obj = jsyaml.load(txt);
    if (obj === undefined) { hideErr(yamlErr); return; }
    jsonEl.value = JSON.stringify(obj, null, 2);
    hideErr(yamlErr);
    hideErr(jsonErr);
    setStatus('ok', 'valid YAML');
    jsonBadge.textContent = 'JSON';
    yamlBadge.textContent = 'YAML';
  } catch(e) {
    showErr(yamlErr, 'YAML: ' + e.message.split('\n')[0]);
    setStatus('error', 'invalid YAML');
  }
}

jsonEl.addEventListener('input', jsonToYaml);
yamlEl.addEventListener('input', yamlToJson);


// ── Copy buttons ──────────────────────────────────────────────
const ICON_COPY  = `<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="4" y="4" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M3 9H2.5C1.67 9 1 8.33 1 7.5V2.5C1 1.67 1.67 1 2.5 1H7.5C8.33 1 9 1.67 9 2.5V3" stroke="currentColor" stroke-width="1.2"/></svg>`;
const ICON_CHECK = `<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2.5 6.5L5.5 9.5L10.5 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function copyBtn(srcEl, btn) {
  const txt = srcEl.value.trim();
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => {
    btn.innerHTML = ICON_CHECK;
    btn.classList.add('copied');
    setTimeout(() => { btn.innerHTML = ICON_COPY; btn.classList.remove('copied'); }, 1600);
  });
}

document.getElementById('copyJsonBtn').addEventListener('click', function() {
  copyBtn(jsonEl, this);
});
document.getElementById('copyYamlBtn').addEventListener('click', function() {
  copyBtn(yamlEl, this);
});

// ── Format badges on focus ────────────────────────────────────
jsonEl.addEventListener('focus', () => { jsonBadge.textContent = 'editing'; });
jsonEl.addEventListener('blur',  () => { jsonBadge.textContent = jsonEl.value.trim() ? 'JSON' : 'auto'; });
yamlEl.addEventListener('focus', () => { yamlBadge.textContent = 'editing'; });
yamlEl.addEventListener('blur',  () => { yamlBadge.textContent = yamlEl.value.trim() ? 'YAML' : 'auto'; });

// ── URL state persistence ─────────────────────────────────────
(function() {
  var _st;
  function saveHash() {
    try {
      var a = document.getElementById('jsonEl').value;
      var b = document.getElementById('yamlEl').value;
      if (!a.trim() && !b.trim()) { history.replaceState(null,'',location.pathname); return; }
      history.replaceState(null,'','#'+btoa(unescape(encodeURIComponent(JSON.stringify({a:a,b:b})))));
    } catch(e) {}
  }
  function loadHash() {
    try {
      if (location.hash.length < 2) return null;
      return JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));
    } catch(e) { return null; }
  }
  window.addEventListener('load', function() {
    var s = loadHash();
    if (s) {
      if (s.a) document.getElementById('jsonEl').value = s.a;
      if (s.b) document.getElementById('yamlEl').value = s.b;
      document.getElementById('jsonEl').dispatchEvent(new Event('input', {bubbles:true}));
    }
    ['jsonEl','yamlEl'].forEach(function(id) {
      document.getElementById(id).addEventListener('input', function() {
        clearTimeout(_st); _st = setTimeout(saveHash, 400);
      });
    });
  });
})();


// ── Share button ──────────────────────────────────────────────
(function() {
  var btn = document.getElementById('shareBtn');
  if (!btn) return;
  btn.addEventListener('click', function() {
    var appName = window.location.pathname.split("/").filter(Boolean).pop();
    var stateHash = window.location.hash.slice(1);
    var url = (window.parent !== window)
      ? window.location.origin + "/apps/suite/#" + appName + (stateHash ? "/" + stateHash : "")
      : window.location.href;
    if (!location.hash || location.hash.length < 2) {
      btn.textContent = 'No state yet';
      setTimeout(function() { btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Share'; }, 1500);
      return;
    }
    navigator.clipboard.writeText(url).then(function() {
      btn.textContent = '✓ Copied!';
      btn.classList.add('copied');
      setTimeout(function() {
        btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Share';
        btn.classList.remove('copied');
      }, 2000);
    });
  });
})();

</script>
