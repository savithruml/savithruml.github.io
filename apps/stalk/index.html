<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<title>Stalk — IP Geolocation</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #161616;
      --border: #2a2a2a;
      --text: #e8e8e8;
      --muted: #999;
      --accent: #84cc16;
      --error: #f87171;
      --radius: 6px;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
    }

    /* Header */
    header {
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .status {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    .status.ok {
      color: var(--accent);
    }
    .status.ok::before {
      background: var(--accent);
    }

    .status.err {
      color: var(--error);
    }
    .status.err::before {
      background: var(--error);
    }

    .status.loading::before {
      background: var(--accent);
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    /* Main */
    main {
      flex: 1;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 24px 60px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Input row */
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 0;
    }

    .ip-input {
      flex: 1;
      font-size: 22px;
      font-family: var(--font-mono);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.15s;
    }

    .ip-input::placeholder {
      color: var(--muted);
      opacity: 0.6;
    }

    .ip-input:focus {
      border-color: var(--accent);
    }

    .lookup-btn {
      background: var(--accent);
      color: #0a1200;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      padding: 14px 22px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
      font-family: inherit;
    }

    .lookup-btn:hover {
      opacity: 0.88;
    }

    .lookup-btn:active {
      opacity: 0.75;
    }

    .lookup-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 60px 0 40px;
      color: var(--muted);
      font-size: 14px;
    }

    .empty-state p {
      color: var(--muted);
      font-size: 14px;
    }

    /* Results */
    .results {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Cert section cards */
    .cert-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .cert-section-title {
      padding: 7px 14px;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-bottom: 1px solid var(--border);
      background: rgba(132, 204, 22, 0.04);
    }

    .cert-row {
      display: flex;
      align-items: flex-start;
      padding: 8px 14px;
      border-bottom: 1px solid #222;
      gap: 10px;
    }

    .cert-row:last-child {
      border-bottom: none;
    }

    .cert-key {
      font-size: 12px;
      color: #888;
      min-width: 120px;
      flex-shrink: 0;
      font-family: var(--font-mono);
    }

    .cert-val {
      font-size: 13px;
      color: #ececec;
      font-family: var(--font-mono);
      word-break: break-all;
      flex: 1;
      line-height: 1.55;
    }

    .cert-val a {
      color: var(--accent);
      text-decoration: none;
    }

    .cert-val a:hover {
      text-decoration: underline;
    }

    /* Map */
    .map-container {
      border-radius: var(--radius);
      overflow: hidden;
    }

    .map-container iframe {
      display: block;
      width: 100%;
      height: 280px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-top: 4px;
    }

    /* Error card */
    .error-card {
      background: var(--surface);
      border: 1px solid var(--error);
      border-radius: var(--radius);
      padding: 14px 16px;
      color: var(--error);
      font-size: 13px;
      font-family: var(--font-mono);
    }

    /* Footer */
    footer {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: #888;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <!-- Logo SVG 34x34 -->
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="34" height="34" rx="7" fill="#0a1200"/>
      <!-- Location pin -->
      <path d="M17 7C13.134 7 10 10.134 10 14C10 19.25 17 27 17 27C17 27 24 19.25 24 14C24 10.134 20.866 7 17 7Z" fill="#84cc16" opacity="0.9"/>
      <!-- Inner circle -->
      <circle cx="17" cy="14" r="3" fill="#0a1200"/>
      <!-- Radar rings -->
      <circle cx="17" cy="14" r="6.5" stroke="#84cc16" stroke-width="1" opacity="0.35" fill="none"/>
      <circle cx="17" cy="14" r="9.5" stroke="#84cc16" stroke-width="0.7" opacity="0.18" fill="none"/>
    </svg>

    <h1>Stalk</h1>

    <span class="status" id="status">Ready</span>
  </header>

  <main>
    <div class="input-row">
      <input
        type="text"
        class="ip-input"
        id="ipInput"
        placeholder="e.g. 8.8.8.8"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      />
      <button class="lookup-btn" id="lookupBtn" onclick="doLookup()">Lookup</button>
    </div>

    <div id="content">
      <!-- Empty state -->
      <div class="empty-state" id="emptyState">
        <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" opacity="0.4">
          <path d="M22 4C15.373 4 10 9.373 10 16C10 25.75 22 40 22 40C22 40 34 25.75 34 16C34 9.373 28.627 4 22 4Z" fill="#84cc16"/>
          <circle cx="22" cy="16" r="4.5" fill="#0f0f0f"/>
          <circle cx="22" cy="16" r="9" stroke="#84cc16" stroke-width="1.5" opacity="0.5" fill="none"/>
          <circle cx="22" cy="16" r="13" stroke="#84cc16" stroke-width="1" opacity="0.25" fill="none"/>
        </svg>
        <p>Enter an IP address to geolocate it</p>
      </div>
    </div>
  </main>

<footer>© 2026 Savithru Lokanath</footer>

  <script>
    const ipInput = document.getElementById('ipInput');
    const lookupBtn = document.getElementById('lookupBtn');
    const statusEl = document.getElementById('status');
    const contentEl = document.getElementById('content');

    // Enter key triggers lookup
    ipInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doLookup();
    });

    function setStatus(state, text) {
      statusEl.className = 'status ' + state;
      statusEl.textContent = text;
    }

    function sanitizeInput(raw) {
      let val = raw.trim();
      // Strip protocol
      val = val.replace(/^https?:\/\//i, '');
      // Strip paths
      val = val.split('/')[0];
      // Strip port
      val = val.split(':')[0];
      return val.trim();
    }

    // Private/reserved IP check
    const PRIVATE_RANGES = [
      /^10\./,
      /^172\.(1[6-9]|2\d|3[01])\./,
      /^192\.168\./,
      /^127\./,
      /^169\.254\./,
      /^::1$/,
      /^fc00:/i,
      /^fd[0-9a-f]{2}:/i,
      /^fe80:/i,
      /^0\.0\.0\.0$/,
      /^255\.255\.255\.255$/,
      /^224\./,
      /^240\./,
    ];

    function isPrivateIP(ip) {
      return PRIVATE_RANGES.some(r => r.test(ip));
    }

    function flagEmoji(countryCode) {
      if (!countryCode || countryCode.length !== 2) return '';
      const offset = 0x1F1E6;
      const A = 0x41;
      return String.fromCodePoint(
        offset + countryCode.toUpperCase().charCodeAt(0) - A,
        offset + countryCode.toUpperCase().charCodeAt(1) - A
      );
    }

    function showError(msg) {
      contentEl.innerHTML = `<div class="error-card">${escapeHtml(msg)}</div>`;
      setStatus('err', 'Error');
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ── Enrichment helpers ──────────────────────────────────────────────────────

    function reverseIP(ip) {
      // IPv4 → reverse octets + .in-addr.arpa
      if (ip.includes('.')) {
        return ip.split('.').reverse().join('.') + '.in-addr.arpa';
      }
      // IPv6 → expand, reverse nibbles + .ip6.arpa
      try {
        const parts = ip.split(':');
        const expanded = parts.map(p => p.padStart(4, '0')).join('');
        return expanded.split('').reverse().join('.') + '.ip6.arpa';
      } catch { return null; }
    }

    async function fetchPTR(ip) {
      const name = reverseIP(ip);
      if (!name) return null;
      const endpoints = [
        `https://cloudflare-dns.com/dns-query?name=${name}&type=PTR&ct=application/dns-json`,
        `https://dns.google/resolve?name=${name}&type=PTR`,
      ];
      for (const url of endpoints) {
        try {
          const r = await fetch(url);
          if (!r.ok) continue;
          const j = await r.json();
          const answer = j.Answer || j.answer;
          if (answer && answer.length > 0) {
            return answer[0].data.replace(/\.$/, '');
          }
        } catch { continue; }
      }
      return null;
    }

    async function fetchRIPE(ip, asnRaw) {
      const result = { prefix: null, holder: null, asType: null, announced: null, abuseEmail: null };

      // Extract ASN number
      const asnMatch = (asnRaw || '').match(/\d+/);
      const asn = asnMatch ? asnMatch[0] : null;

      try {
        const [prefixRes, abuseRes] = await Promise.allSettled([
          fetch(`https://stat.ripe.net/data/prefix-overview/data.json?resource=${encodeURIComponent(ip)}`),
          asn ? fetch(`https://stat.ripe.net/data/abuse-contact-finder/data.json?resource=${encodeURIComponent(ip)}`) : Promise.reject(),
        ]);

        if (prefixRes.status === 'fulfilled' && prefixRes.value.ok) {
          const j = await prefixRes.value.json();
          const prefixes = j?.data?.prefixes;
          if (prefixes && prefixes.length > 0) {
            result.prefix = prefixes[0].prefix;
            const asns = prefixes[0].asns;
            if (asns && asns.length > 0) {
              result.holder = asns[0].holder || asns[0].name || null;
            }
          }
        }

        if (abuseRes.status === 'fulfilled' && abuseRes.value.ok) {
          const j = await abuseRes.value.json();
          const contacts = j?.data?.anti_abuse_contacts?.abuse_c;
          if (contacts && contacts.length > 0 && contacts[0].email) {
            result.abuseEmail = contacts[0].email;
          }
        }

        // AS overview for type
        if (asn) {
          try {
            const r = await fetch(`https://stat.ripe.net/data/as-overview/data.json?resource=AS${asn}`);
            if (r.ok) {
              const j = await r.json();
              result.asType = j?.data?.type || null;
              result.announced = j?.data?.announced ?? null;
            }
          } catch { /* ignore */ }
        }
      } catch { /* ignore */ }

      return result;
    }

    // ── Render ───────────────────────────────────────────────────────────────────

    async function showResults(data, ip) {
      const flag = flagEmoji(data.countryCode);
      const countryStr = flag ? `${flag} ${escapeHtml(data.country)}` : escapeHtml(data.country || '—');
      const coordsHref = `https://www.openstreetmap.org/?mlat=${data.lat}&mlon=${data.lon}#map=12/${data.lat}/${data.lon}`;
      const coordsStr = `<a href="${coordsHref}" target="_blank" rel="noopener">${data.lat}, ${data.lon}</a>`;

      const delta = 0.5;
      const bboxStr = `${data.lon - delta},${data.lat - delta},${data.lon + delta},${data.lat + delta}`;
      const mapSrc = `https://www.openstreetmap.org/export/embed.html?bbox=${bboxStr}&layer=mapnik&marker=${data.lat},${data.lon}`;

      // Extract ASN number for link
      const asnMatch = (data.as || '').match(/(\d+)/);
      const asnNum = asnMatch ? asnMatch[1] : null;
      const asnLink = asnNum
        ? `<a href="https://bgp.he.net/AS${asnNum}" target="_blank" rel="noopener">${escapeHtml(data.as)}</a>`
        : escapeHtml(data.as || '');

      const rows = (entries) => entries
        .filter(([, v]) => v !== null && v !== undefined && v !== '')
        .map(([k, v]) => `
          <div class="cert-row">
            <span class="cert-key">${escapeHtml(k)}</span>
            <span class="cert-val">${v}</span>
          </div>`)
        .join('');

      const locationRows = [
        ['IP',          escapeHtml(data.query || '')],
        ['Country',     countryStr],
        ['Region',      escapeHtml(data.regionName || '')],
        ['City',        escapeHtml(data.city || '')],
        ['Postal',      data.zip ? escapeHtml(data.zip) : null],
        ['Coordinates', coordsStr],
        ['Timezone',    escapeHtml(data.timezone || '')],
      ];

      const networkRows = [
        ['ISP',  escapeHtml(data.isp || '')],
        ['Org',  escapeHtml(data.org || '')],
        ['AS',   asnLink],
      ];

      // Show initial cards immediately
      contentEl.innerHTML = `
        <div class="results" id="resultsInner">
          <div class="cert-section">
            <div class="cert-section-title">Location</div>
            ${rows(locationRows)}
          </div>
          <div class="cert-section">
            <div class="cert-section-title">Network</div>
            ${rows(networkRows)}
          </div>
          <div class="cert-section" id="bgpCard">
            <div class="cert-section-title">BGP / Routing</div>
            <div class="cert-row"><span class="cert-val" style="color:var(--muted);font-size:12px">Fetching…</span></div>
          </div>
          <div class="cert-section" id="dnsCard">
            <div class="cert-section-title">Reverse DNS</div>
            <div class="cert-row"><span class="cert-val" style="color:var(--muted);font-size:12px">Fetching…</span></div>
          </div>
          <div class="map-container">
            <iframe src="${mapSrc}"
              style="width:100%;height:280px;border:1px solid var(--border);border-radius:var(--radius);margin-top:4px"
              loading="lazy" title="Map"></iframe>
          </div>
        </div>`;

      setStatus('ok', 'Located');

      // Fetch enrichment in parallel
      const [ripe, ptr] = await Promise.allSettled([
        fetchRIPE(ip, data.as),
        fetchPTR(ip),
      ]);

      // BGP / Routing card
      const bgpCard = document.getElementById('bgpCard');
      if (bgpCard) {
        const r = ripe.status === 'fulfilled' ? ripe.value : {};
        const bgpRows = [
          ['Prefix',    r.prefix ? escapeHtml(r.prefix) : null],
          ['Holder',    r.holder ? escapeHtml(r.holder) : null],
          ['AS type',   r.asType ? escapeHtml(r.asType) : null],
          ['Announced', r.announced !== null && r.announced !== undefined ? (r.announced ? 'Yes' : 'No') : null],
          ['Abuse',     r.abuseEmail ? `<a href="mailto:${escapeHtml(r.abuseEmail)}">${escapeHtml(r.abuseEmail)}</a>` : null],
        ];
        const bgpHtml = bgpRows
          .filter(([, v]) => v)
          .map(([k, v]) => `<div class="cert-row"><span class="cert-key">${k}</span><span class="cert-val">${v}</span></div>`)
          .join('');
        bgpCard.innerHTML = `
          <div class="cert-section-title">BGP / Routing</div>
          ${bgpHtml || '<div class="cert-row"><span class="cert-val" style="color:var(--muted);font-size:12px">No BGP data available</span></div>'}`;
      }

      // Reverse DNS card
      const dnsCard = document.getElementById('dnsCard');
      if (dnsCard) {
        const hostname = ptr.status === 'fulfilled' ? ptr.value : null;
        dnsCard.innerHTML = `
          <div class="cert-section-title">Reverse DNS</div>
          <div class="cert-row">
            <span class="cert-key">PTR</span>
            <span class="cert-val">${hostname ? escapeHtml(hostname) : '<span style="color:var(--muted)">No PTR record</span>'}</span>
          </div>`;
      }
    }

    async function doLookup() {
      const raw = ipInput.value;
      const ip = sanitizeInput(raw);

      if (!ip) {
        ipInput.focus();
        return;
      }

      // Private IP check
      if (isPrivateIP(ip)) {
        showError('Private / reserved IP address');
        return;
      }

      setStatus('loading', 'Looking up…');
      lookupBtn.disabled = true;

      // Show loading state
      contentEl.innerHTML = `
        <div class="cert-section" style="padding:20px 14px;color:var(--muted);font-size:13px;font-family:var(--font-mono);">
          Fetching data for ${escapeHtml(ip)}…
        </div>`;

      // Multiple providers as fallbacks (same pattern as Scout's DoH endpoints)
      const PROVIDERS = [
        {
          url: (ip) => `https://ipwho.is/${encodeURIComponent(ip)}`,
          normalize: (r) => {
            if (!r.success) throw new Error(r.message || 'Lookup failed');
            return {
              query: r.ip, country: r.country, countryCode: r.country_code,
              regionName: r.region, city: r.city, zip: r.postal,
              lat: r.latitude, lon: r.longitude, timezone: r.timezone?.id,
              isp: r.connection?.isp, org: r.connection?.org,
              as: r.connection?.asn ? `AS${r.connection.asn} ${r.connection?.org || ''}`.trim() : null,
            };
          }
        },
        {
          url: (ip) => `https://ipapi.co/${encodeURIComponent(ip)}/json/`,
          normalize: (r) => {
            if (r.error) throw new Error(r.reason || 'Lookup failed');
            return {
              query: r.ip, country: r.country_name, countryCode: r.country_code,
              regionName: r.region, city: r.city, zip: r.postal,
              lat: r.latitude, lon: r.longitude, timezone: r.timezone,
              isp: r.org, org: r.org,
              as: r.asn ? `${r.asn} ${r.org || ''}`.trim() : null,
            };
          }
        },
        {
          url: (ip) => `https://freeipapi.com/api/json/${encodeURIComponent(ip)}`,
          normalize: (r) => {
            if (r.ipVersion === -1) throw new Error('Lookup failed');
            return {
              query: r.ipAddress, country: r.countryName, countryCode: r.countryCode,
              regionName: r.regionName, city: r.cityName, zip: r.zipCode,
              lat: r.latitude, lon: r.longitude, timezone: r.timeZone,
              isp: null, org: null, as: null,
            };
          }
        },
      ];

      let data = null;
      let lastErr = null;

      try {
        for (const provider of PROVIDERS) {
          try {
            const res = await fetch(provider.url(ip));
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json = await res.json();
            data = provider.normalize(json);
            break;
          } catch (e) {
            lastErr = e;
          }
        }

        if (!data) {
          showError(lastErr?.message || 'All lookup providers failed — check your network.');
        } else {
          showResults(data, ip);
        }
      } catch (err) {
        if (err.name === 'TypeError' && err.message.includes('fetch')) {
          showError('Network error — check your connection.');
        } else {
          showError(err.message || 'An unexpected error occurred.');
        }
      } finally {
        lookupBtn.disabled = false;
      }
    }
  
// ── URL state persistence ─────────────────────────────────────
(function() {
  var _st;
  function saveHash() {
    try {
      var v = document.getElementById('ipInput').value;
      history.replaceState(null,'', v.trim() ? '#'+encodeURIComponent(v) : location.pathname);
    } catch(e) {}
  }
  function loadHash() {
    try {
      if (location.hash.length < 2) return null;
      return decodeURIComponent(location.hash.slice(1));
    } catch(e) { return null; }
  }
  window.addEventListener('load', function() {
    var v = loadHash();
    if (v) {
      document.getElementById('ipInput').value = v;
      document.getElementById('ipInput').dispatchEvent(new KeyboardEvent('keydown', {key:'Enter',bubbles:true}));
    }
    document.getElementById('ipInput').addEventListener('input', function() {
      clearTimeout(_st); _st = setTimeout(saveHash, 400);
    });
  });
})();

</script>
</body>
</html>
