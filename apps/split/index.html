<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Split</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="manifest" href="manifest.json"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f0f0f;
      --surface:   #1a1a1a;
      --border:    #2a2a2a;
      --text:      #ececec;
      --muted:     #888;
      --accent:    #818cf8;
      --radius:    8px;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      --red-bg:    rgba(239,68,68,0.12);
      --red-border:#ef4444;
      --green-bg:  rgba(16,185,129,0.1);
      --green-border:#10b981;
    }

    html { height: 100%; }
    body {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: Helvetica, Arial, sans-serif;
      font-size: 13px;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
      flex-shrink: 0;
    }
    .logo { flex-shrink: 0; width: 35px; height: 35px; }
    header h1 { font-size: 18px; font-weight: 400; letter-spacing: 0.01em; color: var(--text); }
    .status-dot {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .status-dot.ok::before      { background: #10b981; }
    .status-dot.warn::before    { background: #f59e0b; }
    .status-dot.accent::before  { background: var(--accent); }

    /* ── Main layout ── */
    .main-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Workspace (two panes) ── */
    .workspace {
      display: flex;
      flex-shrink: 0;
      height: 45%;
      min-height: 120px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Pane ── */
    .pane {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
      min-width: 0;
    }

    .pane-header {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #aaa;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      position: relative;
    }
    .pane-header .copy-btn {
      position: absolute;
      right: 10px;
    }

    /* ── Pane editor ── */
    .pane-editor {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.65;
      padding: 14px;
      caret-color: var(--accent);
    }
    .pane-editor::placeholder { color: #777; font-size: 14px; }
    .pane-editor:focus { background: #0c0c0c; }
    #afterEl { border-left: 1px solid var(--border); }

    /* ── Pane footer ── */
    .pane-footer {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--surface);
    }

    /* ── v-handle ── */
    .v-handle {
      width: 5px;
      cursor: col-resize;
      background: transparent;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
      transition: background 0.15s;
    }
    .v-handle:hover, .v-handle.dragging { background: var(--accent); opacity: 0.5; }

    /* ── Diff panel ── */
    .diff-panel {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--bg);
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.6;
    }

    .diff-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #888;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 0.01em;
      user-select: none;
    }

    /* ── Diff table (side-by-side) ── */
    .diff-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .diff-table tr { display: flex; }
    .diff-table td {
      padding: 0;
      white-space: pre;
      overflow: hidden;
    }

    /* Line number cells */
    .diff-ln {
      width: 44px;
      min-width: 44px;
      text-align: right;
      padding: 0 8px 0 4px;
      font-size: 11px;
      color: #444;
      flex-shrink: 0;
      user-select: none;
    }

    /* Code content cells */
    .diff-code {
      flex: 1;
      padding: 0 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    /* Center divider */
    .diff-divider {
      width: 1px;
      min-width: 1px;
      background: var(--border);
      flex-shrink: 0;
    }

    /* Side variants */
    .side-removed {
      background: var(--red-bg);
    }
    .side-removed.diff-ln  { color: var(--red-border); opacity: 0.9; border-left: 3px solid var(--red-border); }
    .side-removed.diff-code { color: #fca5a5; }

    .side-added {
      background: var(--green-bg);
    }
    .side-added.diff-ln  { color: var(--green-border); opacity: 0.9; border-left: 3px solid var(--green-border); }
    .side-added.diff-code { color: #6ee7b7; }

    .side-same .diff-code { color: #999; }
    .side-same .diff-ln   { }

    .side-empty {
      background: #080808;
    }
    .side-empty.diff-ln  { border-left: 3px solid transparent; }

    td.side-removed { background: var(--red-bg); }
    td.side-added   { background: var(--green-bg); }
    td.side-empty   { background: #080808; }
    td.side-same    { background: transparent; }

    /* ── Tool buttons ── */
    .tool-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: #888;
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s;
    }
    .tool-btn:hover { color: var(--accent); border-color: var(--accent); }
    .tool-btn.icon-btn { padding: 6px 10px; }
    .tool-btn.icon-btn.copied { color: #10b981; border-color: #10b981; }

    /* ── Footer ── */
    footer {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: #888;
      flex-shrink: 0;
    }

    /* ── Diff toolbar ── */
    /* ── Scrollbar ── */
    .diff-panel::-webkit-scrollbar { width: 6px; }
    .diff-panel::-webkit-scrollbar-track { background: transparent; }
    .diff-panel::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
    .diff-panel::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }
  
    /* ── Share button ── */
    .share-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: #888;
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
      font-family: inherit;
    }
    .share-btn:hover { color: var(--accent); border-color: var(--accent); }
    .share-btn.copied { color: #10b981; border-color: #10b981; }
</style>
</head>

<script>
// ── LCS-based line diff ───────────────────────────────────────
function lcs(a, b) {
  const m = a.length, n = b.length;
  // Use a flat Int32Array for performance on large inputs
  const dp = new Int32Array((m + 1) * (n + 1));
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i * (n + 1) + j] = a[i - 1] === b[j - 1]
        ? dp[(i - 1) * (n + 1) + (j - 1)] + 1
        : Math.max(dp[(i - 1) * (n + 1) + j], dp[i * (n + 1) + (j - 1)]);
    }
  }
  // Backtrack
  const result = [];
  let i = m, j = n;
  while (i > 0 && j > 0) {
    if (a[i - 1] === b[j - 1]) {
      result.push([i - 1, j - 1]);
      i--; j--;
    } else if (dp[(i - 1) * (n + 1) + j] >= dp[i * (n + 1) + (j - 1)]) {
      i--;
    } else {
      j--;
    }
  }
  return result.reverse();
}

function computeDiff(textA, textB) {
  const linesA = textA.split('\n');
  const linesB = textB.split('\n');

  // Guard against very large inputs (cap at 2000 lines for perf)
  const a = linesA.slice(0, 2000);
  const b = linesB.slice(0, 2000);

  const common = lcs(a, b);
  const result = [];

  let ai = 0, bi = 0, ci = 0;
  while (ci < common.length) {
    const [ca, cb] = common[ci];
    // Drain removed lines before this common pair
    while (ai < ca) {
      result.push({ type: 'removed', line: a[ai], ln: ai + 1 });
      ai++;
    }
    // Drain added lines before this common pair
    while (bi < cb) {
      result.push({ type: 'added', line: b[bi], ln: bi + 1 });
      bi++;
    }
    result.push({ type: 'unchanged', line: a[ai], ln: ai + 1, lnB: bi + 1 });
    ai++; bi++; ci++;
  }
  // Drain remaining
  while (ai < a.length) {
    result.push({ type: 'removed', line: a[ai], ln: ai + 1 });
    ai++;
  }
  while (bi < b.length) {
    result.push({ type: 'added', line: b[bi], ln: bi + 1 });
    bi++;
  }
  return result;
}

// ── Build side-by-side pairs ──────────────────────────────────
function buildSideBySide(diff) {
  const rows = [];
  let i = 0;
  while (i < diff.length) {
    if (diff[i].type === 'unchanged') {
      rows.push({ left: diff[i], right: { ...diff[i], type: 'unchanged' } });
      i++;
    } else {
      // collect a block of removed/added lines
      const removed = [], added = [];
      while (i < diff.length && diff[i].type !== 'unchanged') {
        if (diff[i].type === 'removed') removed.push(diff[i]);
        else added.push(diff[i]);
        i++;
      }
      const maxLen = Math.max(removed.length, added.length);
      for (let j = 0; j < maxLen; j++) {
        rows.push({ left: removed[j] || null, right: added[j] || null });
      }
    }
  }
  return rows;
}

// ── Word-level diff helpers ───────────────────────────────────
function wordDiff(lineA, lineB) {
  // Split by whitespace boundaries, preserving spaces as tokens
  const tokA = lineA.split(/(\s+)/);
  const tokB = lineB.split(/(\s+)/);

  const common = lcs(tokA, tokB);
  const resultA = [], resultB = [];

  let ai = 0, bi = 0, ci = 0;
  while (ci < common.length) {
    const [ca, cb] = common[ci];
    while (ai < ca) { resultA.push({ text: tokA[ai], changed: true });  ai++; }
    while (bi < cb) { resultB.push({ text: tokB[bi], changed: true });  bi++; }
    resultA.push({ text: tokA[ai], changed: false }); ai++;
    resultB.push({ text: tokB[bi], changed: false }); bi++;
    ci++;
  }
  while (ai < tokA.length) { resultA.push({ text: tokA[ai], changed: true });  ai++; }
  while (bi < tokB.length) { resultB.push({ text: tokB[bi], changed: true });  bi++; }

  return { tokA: resultA, tokB: resultB };
}

function renderWordTokens(tokens, isRemoved) {
  const hlStyle = isRemoved
    ? 'background:rgba(239,68,68,0.55);border-radius:2px;padding:0 1px;'
    : 'background:rgba(16,185,129,0.5);border-radius:2px;padding:0 1px;';
  return tokens.map(t => {
    const escaped = escHtml(t.text);
    if (t.changed) {
      return `<span style="${hlStyle}">${escaped}</span>`;
    } else {
      return `<span style="opacity:0.5;">${escaped}</span>`;
    }
  }).join('');
}

// ── Render ────────────────────────────────────────────────────
const beforeEl   = document.getElementById('beforeEl');
const afterEl    = document.getElementById('afterEl');
const diffPanel  = document.getElementById('diffPanel');
const diffEmpty  = document.getElementById('diffEmpty');
const diffTable  = document.getElementById('diffTable');
const statusDot  = document.getElementById('statusDot');

function escHtml(s) {
  return s
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function renderDiff() {
  const a = beforeEl.value;
  const b = afterEl.value;

  if (!a.trim() && !b.trim()) {
    diffEmpty.style.display = 'flex';
    diffTable.style.display = 'none';
    setStatus('', 'ready');
    return;
  }

  if (!a.trim() || !b.trim()) {
    diffEmpty.style.display = 'flex';
    diffEmpty.textContent = 'Paste or upload text in both panes to see the diff';
    diffTable.style.display = 'none';
    setStatus('', 'ready');
    return;
  }

  diffEmpty.style.display = 'none';
  diffTable.style.display = '';

  const diff = computeDiff(a, b);
  const pairs = buildSideBySide(diff);

  let added = 0, removed = 0;
  diff.forEach(e => {
    if (e.type === 'added')   added++;
    if (e.type === 'removed') removed++;
  });

  const rows = pairs.map(({ left, right }) => {
    const leftCls  = left  ? (left.type  === 'removed'   ? 'side-removed' : 'side-same') : 'side-empty';
    const rightCls = right ? (right.type === 'added'     ? 'side-added'   : 'side-same') : 'side-empty';

    const leftLn  = left  ? left.ln  : '';
    const rightLn = right ? (right.type === 'unchanged' ? right.lnB : right.ln) : '';

    let leftTxt, rightTxt;
    if (left && right && left.type === 'removed' && right.type === 'added') {
      const wd = wordDiff(left.line, right.line);
      leftTxt  = renderWordTokens(wd.tokA, true);
      rightTxt = renderWordTokens(wd.tokB, false);
    } else {
      leftTxt  = left  ? escHtml(left.line)  : '';
      rightTxt = right ? escHtml(right.line) : '';
    }

    return `<tr>` +
      `<td class="diff-ln ${leftCls}">${leftLn}</td>` +
      `<td class="diff-code ${leftCls}">${leftTxt}</td>` +
      `<td class="diff-divider"></td>` +
      `<td class="diff-ln ${rightCls}">${rightLn}</td>` +
      `<td class="diff-code ${rightCls}">${rightTxt}</td>` +
      `</tr>`;
  });

  diffTable.innerHTML = rows.join('');

  if (added === 0 && removed === 0) {
    diffTable.style.display = 'none';
    diffEmpty.style.display = 'flex';
    diffEmpty.textContent = 'No differences — the two texts are identical';
    setStatus('ok', 'identical');
  } else {
    const parts = [];
    if (added > 0)   parts.push(`+${added}`);
    if (removed > 0) parts.push(`−${removed}`);
    setStatus('accent', parts.join('  '));
  }
}

function setStatus(type, text) {
  statusDot.className = 'status-dot ' + (type || '');
  statusDot.textContent = text;
}

beforeEl.addEventListener('input', renderDiff);
afterEl.addEventListener('input', renderDiff);

// ── v-handle resize ───────────────────────────────────────────
const vHandle    = document.getElementById('vHandle');
const beforePane = document.getElementById('beforePane');
const afterPane  = document.getElementById('afterPane');
let dragging = false, startX = 0, startRatio = 0.5;

vHandle.addEventListener('mousedown', e => {
  dragging = true;
  startX = e.clientX;
  const total = beforePane.offsetWidth + afterPane.offsetWidth;
  startRatio = beforePane.offsetWidth / total;
  vHandle.classList.add('dragging');
  e.preventDefault();
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const total = beforePane.offsetWidth + vHandle.offsetWidth + afterPane.offsetWidth;
  const newW = Math.min(Math.max(startRatio * total + (e.clientX - startX), 180), total - 180);
  beforePane.style.flex = 'none';
  beforePane.style.width = newW + 'px';
  afterPane.style.flex = '1';
});
document.addEventListener('mouseup', () => {
  dragging = false;
  vHandle.classList.remove('dragging');
});

// ── Copy buttons ──────────────────────────────────────────────
const ICON_COPY  = `<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="4" y="4" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M3 9H2.5C1.67 9 1 8.33 1 7.5V2.5C1 1.67 1.67 1 2.5 1H7.5C8.33 1 9 1.67 9 2.5V3" stroke="currentColor" stroke-width="1.2"/></svg>`;
const ICON_CHECK = `<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2.5 6.5L5.5 9.5L10.5 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function copyBtn(srcEl, btn) {
  const txt = srcEl.value.trim();
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => {
    btn.innerHTML = ICON_CHECK;
    btn.classList.add('copied');
    setTimeout(() => { btn.innerHTML = ICON_COPY; btn.classList.remove('copied'); }, 1600);
  });
}

document.getElementById('copyBeforeBtn').addEventListener('click', function() {
  copyBtn(beforeEl, this);
});
document.getElementById('copyAfterBtn').addEventListener('click', function() {
  copyBtn(afterEl, this);
});

// ── Clear ──────────────────────────────────────────────────────
document.getElementById('clearBeforeBtn').addEventListener('click', () => {
  beforeEl.value = '';
  renderDiff();
});
document.getElementById('clearAfterBtn').addEventListener('click', () => {
  afterEl.value = '';
  renderDiff();
});

// ── File upload ───────────────────────────────────────────────
function readFile(input, targetEl) {
  input.addEventListener('change', () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      targetEl.value = e.target.result;
      renderDiff();
    };
    reader.readAsText(file);
    input.value = ''; // reset so same file can be re-uploaded
  });
}

readFile(document.getElementById('uploadBeforeFile'), beforeEl);
readFile(document.getElementById('uploadAfterFile'),  afterEl);

// ── URL state persistence ─────────────────────────────────────
(function() {
  var _st;
  function saveHash() {
    try {
      var a = document.getElementById('beforeEl').value;
      var b = document.getElementById('afterEl').value;
      if (!a.trim() && !b.trim()) { history.replaceState(null,'',location.pathname); return; }
      history.replaceState(null,'','#'+btoa(unescape(encodeURIComponent(JSON.stringify({a:a,b:b})))));
    } catch(e) {}
  }
  function loadHash() {
    try {
      if (location.hash.length < 2) return null;
      return JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));
    } catch(e) { return null; }
  }
  window.addEventListener('load', function() {
    var s = loadHash();
    if (s) {
      if (s.a) document.getElementById('beforeEl').value = s.a;
      if (s.b) document.getElementById('afterEl').value = s.b;
      document.getElementById('beforeEl').dispatchEvent(new Event('input', {bubbles:true}));
    }
    ['beforeEl','afterEl'].forEach(function(id) {
      document.getElementById(id).addEventListener('input', function() {
        clearTimeout(_st); _st = setTimeout(saveHash, 400);
      });
    });
  });
})();


// ── Share button ──────────────────────────────────────────────
(function() {
  var btn = document.getElementById('shareBtn');
  if (!btn) return;
  btn.addEventListener('click', function() {
    var appName = window.location.pathname.split("/").filter(Boolean).pop();
    var stateHash = window.location.hash.slice(1);
    var url = (window.parent !== window)
      ? window.location.origin + "/apps/suite/#" + appName + (stateHash ? "/" + stateHash : "")
      : window.location.href;
    if (!location.hash || location.hash.length < 2) {
      btn.textContent = 'No state yet';
      setTimeout(function() { btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Share'; }, 1500);
      return;
    }
    navigator.clipboard.writeText(url).then(function() {
      btn.textContent = '✓ Copied!';
      btn.classList.add('copied');
      setTimeout(function() {
        btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Share';
        btn.classList.remove('copied');
      }, 2000);
    });
  });
})();

</script>
