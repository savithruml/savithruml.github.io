<svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" width="56" height="56">
  <rect width="56" height="56" rx="13" fill="#080820"/>
  <rect x="1" y="1" width="54" height="54" rx="12" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.35" fill="none"/>
  <!-- Vertical divider line -->
  <line x1="28" y1="10" x2="28" y2="46" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>
  <!-- Left side: removed lines (red-ish) -->
  <line x1="11" y1="18" x2="22" y2="18" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="11" y1="26" x2="22" y2="26" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.5"/>
  <line x1="11" y1="34" x2="22" y2="34" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.5"/>
  <!-- Minus symbol for left -->
  <line x1="11" y1="42" x2="22" y2="42" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right side: added lines (green-ish) -->
  <line x1="34" y1="18" x2="45" y2="18" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.5"/>
  <line x1="34" y1="26" x2="45" y2="26" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="34" y1="34" x2="45" y2="34" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Plus symbol for right -->
  <line x1="34" y1="42" x2="45" y2="42" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.5"/>
</svg>
