<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scout</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="manifest" href="manifest.json"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f0f0f;
      --surface: #161616;
      --border:  #2a2a2a;
      --text:    #e8e8e8;
      --muted:   #999;
      --accent:  #3fb950;
      --error:   #f87171;
      --radius:  6px;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .logo { width: 34px; height: 34px; flex-shrink: 0; }

    header h1 {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.01em;
    }

    .status {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }
    .status::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .status.ok   { color: var(--accent); }
    .status.ok::before   { background: var(--accent); }
    .status.warn { color: #fbbf24; }
    .status.warn::before { background: #fbbf24; }
    .status.err  { color: var(--error); }
    .status.err::before  { background: var(--error); }
    .status.loading::before { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* ── Main ── */
    main {
      flex: 1;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 24px 60px;
    }

    /* ── Input area ── */
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    #hostnameInput {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 22px;
      padding: 14px 18px;
      outline: none;
      transition: border-color 0.15s;
      letter-spacing: 0.02em;
    }
    #hostnameInput::placeholder { color: #888; }
    #hostnameInput:focus { border-color: var(--accent); }

    .lookup-btn {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      padding: 14px 22px;
      color: #000;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .lookup-btn:hover { opacity: 0.88; }
    .lookup-btn:active { transform: scale(0.98); }
    .lookup-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ── Chips ── */
    .chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 32px;
    }

    .chips-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      align-self: center;
      margin-right: 4px;
    }

    .chip {
      background: transparent;
      border: 1px solid #333;
      border-radius: 5px;
      padding: 5px 12px;
      font-size: 12px;
      font-family: var(--font-mono);
      color: #555;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s, background 0.12s, opacity 0.12s;
      user-select: none;
    }
    .chip:hover:not(.active) { color: #888; border-color: #555; }
    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      font-weight: 600;
    }

    /* ── Results ── */
    #resultsView {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Empty / Error state ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: #333;
      gap: 10px;
      pointer-events: none;
      user-select: none;
    }
    .empty-state svg { opacity: 0.4; }
    .empty-state p { font-size: 14px; color: var(--muted); }

    /* ── Cert-style sections ── */
    .cert-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .cert-section-title {
      padding: 7px 14px;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-bottom: 1px solid var(--border);
      background: rgba(63, 185, 80, 0.04);
    }
    .cert-row {
      display: flex;
      align-items: flex-start;
      padding: 8px 14px;
      border-bottom: 1px solid #222;
      gap: 10px;
    }
    .cert-row:last-child { border-bottom: none; }
    .cert-key {
      font-size: 12px;
      color: #888;
      min-width: 80px;
      flex-shrink: 0;
      padding-top: 1px;
      font-family: var(--font-mono);
    }
    .cert-val {
      font-size: 13px;
      color: #ececec;
      font-family: var(--font-mono);
      word-break: break-all;
      flex: 1;
      line-height: 1.55;
    }

    /* ── Footer ── */
    footer {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: #888;
      flex-shrink: 0;
    }
  
    /* ── Share button ── */
    .share-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: #888;
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
      font-family: inherit;
    }
    .share-btn:hover { color: var(--accent); border-color: var(--accent); }
    .share-btn.copied { color: #10b981; border-color: #10b981; }
</style>
</head>
<body>

<header>
  <svg class="logo" width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="34" height="34" rx="7" fill="#000"/>
    <circle cx="15" cy="15" r="7" fill="none" stroke="#3fb950" stroke-width="1.8"/>
    <path d="M15 11 A4 4 0 0 1 19 15" stroke="#3fb950" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <path d="M15 8.5 A6.5 6.5 0 0 1 21.5 15" stroke="#3fb950" stroke-width="1.1" stroke-linecap="round" opacity="0.3"/>
    <line x1="20.5" y1="20.5" x2="26" y2="26" stroke="#3fb950" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <h1>Scout</h1>
  <span class="status" id="statusEl">ready</span>
  <button class="share-btn" id="shareBtn" title="Copy shareable link">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Share
  </button>
</header>

<main>
  <div class="input-row">
    <input type="text" id="hostnameInput" placeholder="e.g. nvidia.com" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"/>
    <button class="lookup-btn" id="lookupBtn">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.5"/>
        <line x1="9.5" y1="9.5" x2="13" y2="13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Lookup
    </button>
  </div>

  <div class="chips-row">
    <span class="chips-label">Types</span>
    <div class="chip active" data-type="A">A</div>
    <div class="chip active" data-type="AAAA">AAAA</div>
    <div class="chip active" data-type="MX">MX</div>
    <div class="chip active" data-type="TXT">TXT</div>
    <div class="chip active" data-type="CNAME">CNAME</div>
    <div class="chip active" data-type="NS">NS</div>
  </div>

  <div id="resultsView">
    <div class="empty-state">
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
        <circle cx="19" cy="19" r="12" stroke="#3fb950" stroke-width="1.8"/>
        <path d="M19 13 A6 6 0 0 1 25 19" stroke="#3fb950" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
        <path d="M19 9.5 A9.5 9.5 0 0 1 28.5 19" stroke="#3fb950" stroke-width="1.3" stroke-linecap="round" opacity="0.35"/>
        <line x1="27.5" y1="27.5" x2="35" y2="35" stroke="#3fb950" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <p>Enter a hostname to look up DNS records</p>
    </div>
  </div>
</main>

<footer>© 2026 Savithru Lokanath</footer>

<script>
// ── Status ────────────────────────────────────────────────────
const statusEl = document.getElementById('statusEl');
function setStatus(type, text) {
  statusEl.className = 'status ' + (type || '');
  statusEl.textContent = text;
}

// ── Chip toggle ───────────────────────────────────────────────
document.querySelector('.chips-row').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  chip.classList.toggle('active');
});

function getSelectedTypes() {
  return [...document.querySelectorAll('.chip.active')].map(c => c.dataset.type);
}

// ── Helpers ───────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function row(key, val) {
  return `<div class="cert-row"><span class="cert-key">${key}</span><span class="cert-val">${val}</span></div>`;
}

function section(title, inner) {
  return `<div class="cert-section"><div class="cert-section-title">${title}</div>${inner}</div>`;
}

// ── DNS-over-HTTPS fetch ──────────────────────────────────────
const DOH_ENDPOINTS = [
  'https://dns.google/resolve',
  'https://8.8.8.8/resolve',
  'https://1.1.1.1/dns-query',
  'https://cloudflare-dns.com/dns-query',
];

async function queryDNS(name, type) {
  let lastErr;
  for (const base of DOH_ENDPOINTS) {
    try {
      const url = `${base}?name=${encodeURIComponent(name)}&type=${encodeURIComponent(type)}`;
      const res = await fetch(url, { headers: { 'Accept': 'application/dns-json' } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    } catch (e) {
      lastErr = e;
    }
  }
  throw new Error(`All DNS endpoints failed: ${lastErr.message}`);
}

// ── Render all results ────────────────────────────────────────
function renderResults(results) {
  const resultsView = document.getElementById('resultsView');
  const sections = [];
  let totalRecords = 0;

  for (const { type, data } of results) {
    if (!data.Answer || data.Answer.length === 0) continue;

    const typeMap = { A: 1, AAAA: 28, MX: 15, TXT: 16, CNAME: 5, NS: 2 };
    const records = data.Answer.filter(r => r.type === typeMap[type]);
    if (records.length === 0) continue;
    totalRecords += records.length;

    // TTL (use first record's value — same for all in a set)
    const ttl = row('TTL', escHtml(String(records[0].TTL)) + 's');

    // All values compactly, one row per record
    const valueRows = records.map(record => {
      const d = record.data;
      if (type === 'MX') {
        const parts = d.trim().split(/\s+/);
        return row('Exchange', `<span style="color:#888;margin-right:10px">${escHtml(parts[0]||'')}</span>${escHtml((parts[1]||'').replace(/\.$/, ''))}`);
      }
      if (type === 'TXT')  return row('Value',      escHtml(d.replace(/^"|"$/g,'').replace(/""/g,'')));
      if (type === 'CNAME') return row('Target',    escHtml(d.replace(/\.$/, '')));
      if (type === 'NS')    return row('Nameserver',escHtml(d.replace(/\.$/, '')));
      if (type === 'AAAA')  return row('IPv6',      escHtml(d));
      return row('Address', escHtml(d));
    }).join('');

    sections.push(section(`${type} Records (${records.length})`, ttl + valueRows));
  }

  if (sections.length === 0) {
    resultsView.innerHTML = `<div class="empty-state">
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
        <circle cx="19" cy="19" r="12" stroke="#3fb950" stroke-width="1.8"/>
        <path d="M19 13 A6 6 0 0 1 25 19" stroke="#3fb950" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
        <path d="M19 9.5 A9.5 9.5 0 0 1 28.5 19" stroke="#3fb950" stroke-width="1.3" stroke-linecap="round" opacity="0.35"/>
        <line x1="27.5" y1="27.5" x2="35" y2="35" stroke="#3fb950" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <p>No records found</p>
    </div>`;
    setStatus('warn', 'no records found');
    return;
  }

  resultsView.innerHTML = sections.join('');
  const plural = totalRecords === 1 ? '1 record found' : `${totalRecords} records found`;
  setStatus('ok', plural);
}

// ── Lookup ────────────────────────────────────────────────────
const lookupBtn     = document.getElementById('lookupBtn');
const hostnameInput = document.getElementById('hostnameInput');
const resultsView   = document.getElementById('resultsView');

async function doLookup() {
  const hostname = hostnameInput.value.trim().toLowerCase().replace(/^https?:\/\//, '').replace(/\/.*$/, '');
  if (!hostname) { hostnameInput.focus(); return; }

  const types = getSelectedTypes();
  if (types.length === 0) {
    setStatus('warn', 'select at least one record type');
    return;
  }

  lookupBtn.disabled = true;
  setStatus('loading', 'looking up…');

  resultsView.innerHTML = `<div class="empty-state">
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none" style="opacity:0.5">
      <circle cx="19" cy="19" r="12" stroke="#3fb950" stroke-width="1.8"/>
      <line x1="27.5" y1="27.5" x2="35" y2="35" stroke="#3fb950" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <p style="color:#555">Querying DNS…</p>
  </div>`;

  try {
    const queries = types.map(type =>
      queryDNS(hostname, type)
        .then(data => ({ type, data, error: null }))
        .catch(err => ({ type, data: { Answer: [] }, error: err.message }))
    );
    const results = await Promise.all(queries);
    const errors = results.filter(r => r.error);
    if (errors.length === types.length) {
      resultsView.innerHTML = `<div class="empty-state"><p style="color:#f87171">DNS lookup failed: ${escHtml(errors[0].error)}<br><small style="color:#666">Your network may block DNS-over-HTTPS endpoints.</small></p></div>`;
      setStatus('err', 'lookup failed');
      return;
    }
    renderResults(results);
  } catch (err) {
    resultsView.innerHTML = `<div class="empty-state"><p style="color:#f87171">${escHtml('Error: ' + err.message)}</p></div>`;
    setStatus('err', 'lookup failed');
  } finally {
    lookupBtn.disabled = false;
  }
}

lookupBtn.addEventListener('click', doLookup);
hostnameInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLookup(); });

// ── URL state persistence ─────────────────────────────────────
(function() {
  var _st;
  function saveHash() {
    try {
      var v = document.getElementById('hostnameInput').value;
      history.replaceState(null,'', v.trim() ? '#'+encodeURIComponent(v) : location.pathname);
    } catch(e) {}
  }
  function loadHash() {
    try {
      if (location.hash.length < 2) return null;
      return decodeURIComponent(location.hash.slice(1));
    } catch(e) { return null; }
  }
  window.addEventListener('load', function() {
    var v = loadHash();
    if (v) {
      document.getElementById('hostnameInput').value = v;
      document.getElementById('hostnameInput').dispatchEvent(new KeyboardEvent('keydown', {key:'Enter',bubbles:true}));
    }
    document.getElementById('hostnameInput').addEventListener('input', function() {
      clearTimeout(_st); _st = setTimeout(saveHash, 400);
    });
  });
})();


// ── Share button ──────────────────────────────────────────────
(function() {
  var btn = document.getElementById('shareBtn');
  if (!btn) return;
  btn.addEventListener('click', function() {
    var url = window.location.href;
    if (!location.hash || location.hash.length < 2) {
      btn.textContent = 'No state yet';
      setTimeout(function() { btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Share'; }, 1500);
      return;
    }
    navigator.clipboard.writeText(url).then(function() {
      btn.textContent = '✓ Copied!';
      btn.classList.add('copied');
      setTimeout(function() {
        btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Share';
        btn.classList.remove('copied');
      }, 2000);
    });
  });
})();

</script>
</body>
</html>
