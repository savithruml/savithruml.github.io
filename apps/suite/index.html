<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <title>Suite</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #161616;
      --surface2: #1e1e1e;
      --border: #2a2a2a;
      --text: #e8e8e8;
      --muted: #888;
      --radius: 6px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      overflow: hidden;
    }

    /* ── Top bar ── */
    #topbar {
      height: 42px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      flex-shrink: 0;
      user-select: none;
    }

    #sidebar-toggle {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--muted);
      flex-shrink: 0;
      transition: color 0.1s;
    }
    #sidebar-toggle:hover { color: var(--text); }

    #suite-wordmark {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #555;
      padding: 0 12px 0 4px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      height: 100%;
      display: flex;
      align-items: center;
    }

    #tab-bar {
      display: flex;
      align-items: center;
      flex: 1;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      gap: 2px;
      padding: 0 6px;
      height: 100%;
    }
    #tab-bar::-webkit-scrollbar { display: none; }

    .tab {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 8px 0 8px;
      height: 30px;
      border-radius: 5px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      color: var(--muted);
      font-size: 13px;
      transition: background 0.1s, color 0.1s;
    }
    .tab:hover { background: var(--surface2); color: var(--text); }
    .tab.active { background: var(--surface2); color: var(--text); }

    .tab-icon { flex-shrink: 0; display: flex; align-items: center; border-radius: 4px; overflow: hidden; }
    .tab-icon svg { display: block; }

    .tab-close {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      margin-left: 1px;
      flex-shrink: 0;
      transition: background 0.1s, color 0.1s;
    }
    .tab:hover .tab-close { color: var(--muted); }
    .tab-close:hover { background: #333 !important; color: var(--text) !important; }

    #new-tab-btn {
      width: 30px;
      height: 30px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--muted);
      flex-shrink: 0;
      transition: background 0.1s, color 0.1s;
    }
    #new-tab-btn:hover { background: var(--surface2); color: var(--text); }

    /* ── Layout ── */
    #layout {
      display: flex;
      height: calc(100vh - 42px);
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 192px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      flex-shrink: 0;
      transition: width 0.18s cubic-bezier(.4,0,.2,1);
      scrollbar-width: thin;
      scrollbar-color: #2a2a2a transparent;
    }
    #sidebar.collapsed { width: 0; border-right: none; }
    #sidebar::-webkit-scrollbar { width: 4px; }
    #sidebar::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }

    .sidebar-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #444;
      padding: 14px 14px 6px;
      white-space: nowrap;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 5px 12px;
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      transition: background 0.1s, color 0.1s;
    }
    .sidebar-item:hover { background: #1b1b1b; color: #ccc; }
    .sidebar-item.open { color: #bbb; }
    .sidebar-item.active { color: var(--text); background: #1f1f1f; }

    .sidebar-icon { flex-shrink: 0; display: flex; align-items: center; border-radius: 5px; overflow: hidden; }
    .sidebar-icon svg { display: block; }

    /* ── Content area ── */
    #content-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--bg);
    }

    /* ── Welcome screen ── */
    #welcome {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 60px 40px 40px;
      overflow-y: auto;
      gap: 36px;
    }

    #welcome-header { text-align: center; }
    #welcome-header h1 {
      font-size: 24px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    #welcome-header p { font-size: 14px; color: var(--muted); }

    #welcome-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 8px;
      width: 100%;
      max-width: 880px;
    }

    .welcome-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.15s, background 0.15s;
    }
    .welcome-card:hover { border-color: #3a3a3a; background: #1a1a1a; }
    .welcome-card.open-indicator { border-color: #333; }

    .welcome-icon { flex-shrink: 0; display: flex; align-items: center; border-radius: 7px; overflow: hidden; }
    .welcome-icon svg { display: block; }

    .welcome-card-text { min-width: 0; }
    .welcome-card-name { font-size: 13px; font-weight: 500; color: var(--text); }
    .welcome-card-desc { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .open-badge {
      margin-left: auto;
      font-size: 10px;
      font-weight: 500;
      color: #555;
      background: #222;
      border: 1px solid #333;
      border-radius: 3px;
      padding: 1px 5px;
      flex-shrink: 0;
    }

    /* ── App iframes ── */
    .app-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }
    .app-frame.active { display: block; }
  </style>
</head>
<body>

<div id="topbar">
  <div id="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar">
    <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
      <rect x="1" y="3.5" width="13" height="1.4" rx=".7" fill="currentColor"/>
      <rect x="1" y="6.8" width="13" height="1.4" rx=".7" fill="currentColor"/>
      <rect x="1" y="10.1" width="13" height="1.4" rx=".7" fill="currentColor"/>
    </svg>
  </div>
  <div id="suite-wordmark">Suite</div>
  <div id="tab-bar"></div>
  <div id="new-tab-btn" onclick="showWelcome()" title="New tab">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
      <path d="M6.5 1v11M1 6.5h11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
  </div>
</div>

<div id="layout">
  <div id="sidebar">
    <div class="sidebar-label">Apps</div>
    <div id="sidebar-items"></div>
  </div>
  <div id="content-wrap">
    <div id="welcome">
      <div id="welcome-header">
        <h1>Suite</h1>
        <p>All your network tools in one place. Click any app to open it.</p>
      </div>
      <div id="welcome-grid"></div>
    </div>
  </div>
</div>

<script>

  Slice: `<rect width="56" height="56" rx="13" fill="#1a2e1e"/><rect x="1" y="1" width="54" height="54" rx="12" stroke="#6ee7b7" stroke-width="1.2" stroke-opacity="0.35" fill="none"/><line x1="33" y1="14" x2="23" y2="42" stroke="#6ee7b7" stroke-width="3.5" stroke-linecap="round"/><line x1="14" y1="21" x2="21" y2="28" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round"/><line x1="42" y1="28" x2="35" y2="35" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round"/>`,

function mkIcon(name, size) {
  return `<svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}">${ICONS[name]}</svg>`;
}

// ── App data ───────────────────────────────────────────────────────────
const APPS = [
  { name: 'Scale',    path: '/apps/scale/',    desc: 'Unit & currency converter'    },
  { name: 'Scaffold', path: '/apps/scaffold/', desc: 'Network topology visualizer'  },
  { name: 'Scout',    path: '/apps/scout/',    desc: 'DNS lookup tool'              },
  { name: 'Seal',     path: '/apps/seal/',     desc: 'TLS certificate inspector'    },
  { name: 'Sift',     path: '/apps/sift/',     desc: 'Whois parser'                 },
  { name: 'Sigil',    path: '/apps/sigil/',    desc: 'JWT decoder'                  },
  { name: 'Skim',     path: '/apps/skim/',     desc: 'OpenAPI spec browser'         },
  { name: 'Slice',    path: '/apps/slice/',    desc: 'Subnet calculator'            },
  { name: 'Span',     path: '/apps/span/',     desc: 'Traceroute visualizer'        },
  { name: 'Split',    path: '/apps/split/',    desc: 'Text diff tool'               },
  { name: 'Stalk',    path: '/apps/stalk/',    desc: 'IP geolocation & BGP info'    },
  { name: 'Stencil',  path: '/apps/stencil/',  desc: 'Jinja template renderer'      },
  { name: 'Sundial',  path: '/apps/sundial/',  desc: 'Unix timestamp converter'     },
  { name: 'Swap',     path: '/apps/swap/',     desc: 'JSON ↔ YAML converter'        },
];

// ── State ──────────────────────────────────────────────────────────────
let tabs        = [];
let activeTabId = null;
let sidebarOpen = true;

// ── Init ───────────────────────────────────────────────────────────────
function init() {
  buildSidebar();
  buildWelcomeGrid();
}

function buildSidebar() {
  const container = document.getElementById('sidebar-items');
  APPS.forEach(app => {
    const el = document.createElement('div');
    el.className = 'sidebar-item';
    el.id = `sb-${app.name}`;
    el.innerHTML = `<span class="sidebar-icon">${mkIcon(app.name, 22)}</span><span>${app.name}</span>`;
    el.onclick = () => openApp(app);
    container.appendChild(el);
  });
}

function buildWelcomeGrid() {
  const grid = document.getElementById('welcome-grid');
  APPS.forEach(app => {
    const card = document.createElement('div');
    card.className = 'welcome-card';
    card.id = `wc-${app.name}`;
    card.innerHTML = `
      <span class="welcome-icon">${mkIcon(app.name, 34)}</span>
      <div class="welcome-card-text">
        <div class="welcome-card-name">${app.name}</div>
        <div class="welcome-card-desc">${app.desc}</div>
      </div>
    `;
    card.onclick = () => openApp(app);
    grid.appendChild(card);
  });
}

// ── Tab management ─────────────────────────────────────────────────────
function openApp(app) {
  const existing = tabs.find(t => t.path === app.path);
  if (existing) { setActive(existing.id); return; }

  const id = Date.now() + Math.random();
  tabs.push({ id, name: app.name, path: app.path });

  const iframe = document.createElement('iframe');
  iframe.className = 'app-frame';
  iframe.id = `frame-${id}`;
  iframe.src = app.path;
  iframe.setAttribute('allow', 'clipboard-write');
  document.getElementById('content-wrap').appendChild(iframe);

  renderTabs();
  setActive(id);
  updateWelcomeCards();
}

function closeTab(id, e) {
  if (e) e.stopPropagation();
  const idx = tabs.findIndex(t => t.id === id);
  if (idx === -1) return;
  tabs.splice(idx, 1);
  document.getElementById(`frame-${id}`)?.remove();

  if (activeTabId === id) {
    if (tabs.length) setActive(tabs[Math.min(idx, tabs.length - 1)].id);
    else { activeTabId = null; showWelcome(); }
  }
  renderTabs();
  updateSidebarHighlight();
  updateWelcomeCards();
}

function setActive(id) {
  activeTabId = id;
  document.querySelectorAll('.app-frame').forEach(f => f.classList.remove('active'));
  document.getElementById(`frame-${id}`)?.classList.add('active');
  document.getElementById('welcome').style.display = 'none';
  renderTabs();
  updateSidebarHighlight();
}

function showWelcome() {
  activeTabId = null;
  document.querySelectorAll('.app-frame').forEach(f => f.classList.remove('active'));
  document.getElementById('welcome').style.display = 'flex';
  renderTabs();
  updateSidebarHighlight();
}

// ── Render ─────────────────────────────────────────────────────────────
function renderTabs() {
  const bar = document.getElementById('tab-bar');
  bar.innerHTML = '';
  tabs.forEach(tab => {
    const el = document.createElement('div');
    el.className = 'tab' + (tab.id === activeTabId ? ' active' : '');
    el.innerHTML = `
      <span class="tab-icon">${mkIcon(tab.name, 18)}</span>
      <span>${tab.name}</span>
      <span class="tab-close" title="Close">
        <svg width="9" height="9" viewBox="0 0 9 9" fill="none">
          <path d="M1.5 1.5l6 6M7.5 1.5l-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </span>
    `;
    el.querySelector('.tab-close').onclick = (e) => closeTab(tab.id, e);
    el.onclick = () => setActive(tab.id);
    bar.appendChild(el);
  });
}

function updateSidebarHighlight() {
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active', 'open'));
  tabs.forEach(tab => {
    document.getElementById(`sb-${tab.name}`)?.classList.add('open');
  });
  if (activeTabId) {
    const tab = tabs.find(t => t.id === activeTabId);
    if (tab) {
      const el = document.getElementById(`sb-${tab.name}`);
      if (el) { el.classList.add('active'); el.classList.remove('open'); }
    }
  }
}

function updateWelcomeCards() {
  document.querySelectorAll('.welcome-card').forEach(card => {
    card.querySelector('.open-badge')?.remove();
    card.classList.remove('open-indicator');
  });
  tabs.forEach(tab => {
    const card = document.getElementById(`wc-${tab.name}`);
    if (card) {
      card.classList.add('open-indicator');
      const badge = document.createElement('span');
      badge.className = 'open-badge';
      badge.textContent = 'open';
      card.appendChild(badge);
    }
  });
}

// ── Sidebar toggle ─────────────────────────────────────────────────────
function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById('sidebar').classList.toggle('collapsed', !sidebarOpen);
}

// ── Keyboard: Cmd/Ctrl+W closes active tab ─────────────────────────────
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'w' && activeTabId !== null) {
    e.preventDefault();
    closeTab(activeTabId, null);
  }
});

init();
</script>
</body>
</html>
